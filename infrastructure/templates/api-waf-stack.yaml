AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  StreamMyCourse - REGIONAL WAFv2 Web ACL for the catalog API Gateway stage (eu-west-1).
  Rate limit on /courses* with /webhooks/* excluded; AWS managed common rule set in count mode by default.

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - prod
    Description: Deployment environment (matches API stage name when CatalogApiStageName is omitted)

  CatalogApiRestApiId:
    Type: String
    Default: ''
    Description: REST API id from api-stack (CatalogApi). Required when EnableWafApi is true.

  CatalogApiStageName:
    Type: String
    Default: ''
    Description: API Gateway stage name (defaults to Environment when empty)

  EnableWafApi:
    Type: String
    Default: 'true'
    AllowedValues:
      - 'true'
      - 'false'
    Description: When false, no WAF resources are created (stack may include a CFN placeholder only)

  EnableManagedRulesBlock:
    Type: String
    Default: 'false'
    AllowedValues:
      - 'true'
      - 'false'
    Description: When false, AWSManagedRulesCommonRuleSet uses Count (observe-only); when true, uses vendor block action

  ApiRateLimit:
    Type: Number
    Default: 2000
    MinValue: 100
    MaxValue: 20000000
    Description: Max requests per IP per 5-minute evaluation window on scoped /courses* traffic

Conditions:
  WafEnabled: !Equals [!Ref EnableWafApi, 'true']
  WafDisabled: !Not [!Condition WafEnabled]
  ManagedRulesBlock: !Equals [!Ref EnableManagedRulesBlock, 'true']
  HasCatalogApiRestApiId: !Not [!Equals [!Ref CatalogApiRestApiId, '']]
  DeployWaf: !And
    - !Condition WafEnabled
    - !Condition HasCatalogApiRestApiId
  UseDefaultStageName: !Equals [!Ref CatalogApiStageName, '']

Resources:
  WafDisabledPlaceholder:
    Type: AWS::CloudFormation::WaitConditionHandle
    Condition: WafDisabled

  ApiWebAcl:
    Type: AWS::WAFv2::WebACL
    Condition: DeployWaf
    Properties:
      Name: !Sub 'StreamMyCourse-ApiWaf-${Environment}'
      Description: !Sub 'Catalog API WAF for ${Environment} - courses rate limit and managed rules'
      Scope: REGIONAL
      DefaultAction:
        Allow: {}
      VisibilityConfig:
        SampledRequestsEnabled: true
        CloudWatchMetricsEnabled: true
        MetricName: !Sub 'StreamMyCourseApiWaf-${Environment}'
      Rules:
        - Name: CoursesRateLimitExcludeWebhooks
          Priority: 1
          Action:
            Block: {}
          Statement:
            RateBasedStatement:
              Limit: !Ref ApiRateLimit
              AggregateKeyType: IP
              EvaluationWindowSec: 300
              ScopeDownStatement:
                AndStatement:
                  Statements:
                    - ByteMatchStatement:
                        FieldToMatch:
                          UriPath: {}
                        PositionalConstraint: STARTS_WITH
                        SearchString: !Base64 '/courses'
                        TextTransformations:
                          - Priority: 0
                            Type: NONE
                    - NotStatement:
                        Statement:
                          ByteMatchStatement:
                            FieldToMatch:
                              UriPath: {}
                            PositionalConstraint: STARTS_WITH
                            SearchString: !Base64 '/webhooks'
                            TextTransformations:
                              - Priority: 0
                                Type: NONE
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: !Sub 'ApiWafCoursesRate-${Environment}'
        - Name: AWSManagedRulesCommonRuleSet
          Priority: 2
          OverrideAction: !If
            - ManagedRulesBlock
            - None: {}
            - Count: {}
          Statement:
            ManagedRuleGroupStatement:
              VendorName: AWS
              Name: AWSManagedRulesCommonRuleSet
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: !Sub 'ApiWafCommonRules-${Environment}'
        - Name: AWSManagedRulesKnownBadInputsRuleSet
          Priority: 3
          OverrideAction:
            None: {}
          Statement:
            ManagedRuleGroupStatement:
              VendorName: AWS
              Name: AWSManagedRulesKnownBadInputsRuleSet
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: !Sub 'ApiWafKnownBadInputs-${Environment}'
      Tags:
        - Key: Project
          Value: StreamMyCourse
        - Key: Environment
          Value: !Ref Environment

  ApiWebAclAssociation:
    Type: AWS::WAFv2::WebACLAssociation
    Condition: DeployWaf
    Properties:
      WebACLArn: !GetAtt ApiWebAcl.Arn
      ResourceArn: !Sub
        - 'arn:aws:apigateway:${AWS::Region}::/restapis/${RestApiId}/stages/${StageName}'
        - RestApiId: !Ref CatalogApiRestApiId
          StageName: !If
            - UseDefaultStageName
            - !Ref Environment
            - !Ref CatalogApiStageName

Outputs:
  ApiWebAclArn:
    Condition: DeployWaf
    Description: REGIONAL Web ACL ARN associated with the catalog API stage
    Value: !GetAtt ApiWebAcl.Arn
    Export:
      Name: !Sub '${AWS::StackName}-ApiWebAclArn'

  ApiWebAclId:
    Condition: DeployWaf
    Description: REGIONAL Web ACL id
    Value: !GetAtt ApiWebAcl.Id
    Export:
      Name: !Sub '${AWS::StackName}-ApiWebAclId'

  ApiWebAclAssociationResourceArn:
    Condition: DeployWaf
    Description: API Gateway stage ARN protected by the Web ACL
    Value: !Sub
      - 'arn:aws:apigateway:${AWS::Region}::/restapis/${RestApiId}/stages/${StageName}'
      - RestApiId: !Ref CatalogApiRestApiId
        StageName: !If
          - UseDefaultStageName
          - !Ref Environment
          - !Ref CatalogApiStageName
