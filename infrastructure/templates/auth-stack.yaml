AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  StreamMyCourse - Cognito User Pool (student native email/password + Google; teacher Google OAuth;
  optional PreSignUp linking and Zoho SMTP CustomEmailSender; no Identity Pool)

Parameters:
  Environment:
    Type: String
    AllowedValues: [prod]
    Default: prod

  CognitoDomainPrefix:
    Type: String
    Description: Globally unique hosted UI domain prefix (e.g. streammycourse-auth-prod)

  StudentCallbackUrls:
    Type: String
    Description: Comma-separated OAuth callback URLs for the student SPA (must match app client)
    Default: 'http://localhost:5173/,http://127.0.0.1:5173/'

  StudentLogoutUrls:
    Type: String
    Description: Comma-separated sign-out URLs for the student SPA
    Default: 'http://localhost:5173/,http://127.0.0.1:5173/'

  TeacherCallbackUrls:
    Type: String
    Description: Comma-separated OAuth callback URLs for the teacher SPA
    Default: 'http://localhost:5174/,http://127.0.0.1:5174/'

  TeacherLogoutUrls:
    Type: String
    Description: Comma-separated sign-out URLs for the teacher SPA
    Default: 'http://localhost:5174/,http://127.0.0.1:5174/'

  GoogleClientId:
    Type: String
    MinLength: 1
    Description: Google OAuth client ID (required for Google IdP)

  GoogleClientSecret:
    Type: String
    NoEcho: true
    MinLength: 1
    Description: Google OAuth client secret (required for Google IdP)

  RdsStackName:
    Type: String
    Default: ''
    Description: >-
      RDS stack name (e.g. StreamMyCourse-Rds-prod) whose exports supply VPC, DB
      secret, and endpoints for the optional PostAuthentication user sync Lambda.
      Leave empty to skip the sync Lambda (local auth-only deploys).

  EnableUserProfileSync:
    Type: String
    Default: 'false'
    AllowedValues:
      - 'true'
      - 'false'
    Description: >-
      When true, and RdsStackName plus Lambda S3 code params are set, attach
      PostAuthentication to upsert RDS users on each successful login.

  CognitoUserProfileSyncCodeS3Bucket:
    Type: String
    Default: ''
    Description: Artifacts bucket containing the Cognito user profile sync Lambda zip

  CognitoUserProfileSyncCodeS3Key:
    Type: String
    Default: ''
    Description: S3 key for the Cognito user profile sync Lambda deployment zip

  StudentCognitoClientId:
    Type: String
    Default: ''
    Description: >-
      Student app client ID for single-session Pre Token routing (set from stack
      output on deploy; avoids circular Ref from sync Lambda to UserPoolClient).

  TeacherCognitoClientId:
    Type: String
    Default: ''
    Description: >-
      Teacher app client ID for Pre Token pass-through routing (optional guard).

  CognitoPreSignUpCodeS3Bucket:
    Type: String
    Default: ''
    Description: Artifacts bucket containing the Cognito PreSignUp Lambda zip

  CognitoPreSignUpCodeS3Key:
    Type: String
    Default: ''
    Description: S3 key for the Cognito PreSignUp Lambda deployment zip

  CognitoCustomEmailSenderCodeS3Bucket:
    Type: String
    Default: ''
    Description: Artifacts bucket containing the Cognito custom email sender (Zoho SMTP) Lambda zip

  CognitoCustomEmailSenderCodeS3Key:
    Type: String
    Default: ''
    Description: S3 key for the Cognito custom email sender Lambda deployment zip

  ZohoSmtpSecretArn:
    Type: String
    Default: ''
    Description: >-
      Secrets Manager ARN for Zoho SMTP JSON (smtp_username, smtp_password, optional host/port/from/reply_to).
      Example secret id streammycourse/zoho-smtp/prod.

Conditions:
  HasRdsStackName: !Not [!Equals [!Ref RdsStackName, '']]
  HasSyncLambdaCode: !And
    - !Not [!Equals [!Ref CognitoUserProfileSyncCodeS3Bucket, '']]
    - !Not [!Equals [!Ref CognitoUserProfileSyncCodeS3Key, '']]
  ShouldDeployUserProfileSync: !And
    - !Condition HasRdsStackName
    - !Equals [!Ref EnableUserProfileSync, 'true']
    - !Condition HasSyncLambdaCode
  HasPreSignUpCode: !And
    - !Not [!Equals [!Ref CognitoPreSignUpCodeS3Bucket, '']]
    - !Not [!Equals [!Ref CognitoPreSignUpCodeS3Key, '']]
  ShouldDeployPreSignUp: !Condition HasPreSignUpCode
  HasCustomEmailSenderCode: !And
    - !Not [!Equals [!Ref CognitoCustomEmailSenderCodeS3Bucket, '']]
    - !Not [!Equals [!Ref CognitoCustomEmailSenderCodeS3Key, '']]
  HasZohoSmtpSecret: !Not [!Equals [!Ref ZohoSmtpSecretArn, '']]
  ShouldDeployCustomEmailSender: !And
    - !Condition ShouldDeployPreSignUp
    - !Condition HasCustomEmailSenderCode
    - !Condition HasZohoSmtpSecret
  ShouldDeployUserProfileSyncAndPreSignUp: !And
    - !Condition ShouldDeployUserProfileSync
    - !Condition ShouldDeployPreSignUp

Resources:
  UserProfileSyncLambdaRole:
    Type: AWS::IAM::Role
    Condition: ShouldDeployUserProfileSync
    Properties:
      RoleName: !Sub '${AWS::StackName}-UserProfileSyncLambdaRole'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
      Policies:
        - PolicyName: CloudWatchLogs
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${AWS::StackName}-UserProfileSync:*'
        - PolicyName: SecretsManagerRdsCreds
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource: !ImportValue
                  'Fn::Sub': '${RdsStackName}-DbSecretArn'
        - PolicyName: LambdaVpcEni
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - ec2:CreateNetworkInterface
                  - ec2:DescribeNetworkInterfaces
                  - ec2:DeleteNetworkInterface
                  - ec2:AssignPrivateIpAddresses
                  - ec2:UnassignPrivateIpAddresses
                Resource: '*'
        - PolicyName: CognitoAdminUpdateUserAttributes
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - cognito-idp:AdminUpdateUserAttributes
                Resource: !Sub 'arn:aws:cognito-idp:${AWS::Region}:${AWS::AccountId}:userpool/*'
      Tags:
        - Key: Project
          Value: StreamMyCourse
        - Key: Environment
          Value: !Ref Environment

  UserProfileSyncLambda:
    Type: AWS::Lambda::Function
    Condition: ShouldDeployUserProfileSync
    DependsOn:
      - UserProfileSyncLambdaRole
    Properties:
      FunctionName: !Sub '${AWS::StackName}-UserProfileSync'
      Runtime: python3.11
      Handler: handler.lambda_handler
      Role: !GetAtt UserProfileSyncLambdaRole.Arn
      Timeout: 30
      MemorySize: 256
      VpcConfig:
        SubnetIds:
          - !ImportValue
            'Fn::Sub': '${RdsStackName}-PrivateSubnetId'
        SecurityGroupIds:
          - !ImportValue
            'Fn::Sub': '${RdsStackName}-LambdaSecurityGroupId'
      Environment:
        Variables:
          DB_SECRET_ARN: !ImportValue
            'Fn::Sub': '${RdsStackName}-DbSecretArn'
          DB_HOST: !ImportValue
            'Fn::Sub': '${RdsStackName}-DbHost'
          DB_PORT: !ImportValue
            'Fn::Sub': '${RdsStackName}-DbPort'
          DB_NAME: !ImportValue
            'Fn::Sub': '${RdsStackName}-DbName'
          LOG_LEVEL: INFO
          STUDENT_COGNITO_CLIENT_ID: !Ref StudentCognitoClientId
          TEACHER_COGNITO_CLIENT_ID: !Ref TeacherCognitoClientId
      Code:
        S3Bucket: !Ref CognitoUserProfileSyncCodeS3Bucket
        S3Key: !Ref CognitoUserProfileSyncCodeS3Key
      Tags:
        - Key: Project
          Value: StreamMyCourse
        - Key: Environment
          Value: !Ref Environment

  CognitoPreSignUpLambdaRole:
    Type: AWS::IAM::Role
    Condition: ShouldDeployPreSignUp
    Properties:
      RoleName: !Sub '${AWS::StackName}-CognitoPreSignUpLambdaRole'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: CloudWatchLogs
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${AWS::StackName}-CognitoPreSignUp:*'
      Tags:
        - Key: Project
          Value: StreamMyCourse
        - Key: Environment
          Value: !Ref Environment

  CognitoPreSignUpLambda:
    Type: AWS::Lambda::Function
    Condition: ShouldDeployPreSignUp
    DependsOn:
      - CognitoPreSignUpLambdaRole
    Properties:
      FunctionName: !Sub '${AWS::StackName}-CognitoPreSignUp'
      Runtime: python3.11
      Handler: handler.lambda_handler
      Role: !GetAtt CognitoPreSignUpLambdaRole.Arn
      Timeout: 10
      MemorySize: 128
      Code:
        S3Bucket: !Ref CognitoPreSignUpCodeS3Bucket
        S3Key: !Ref CognitoPreSignUpCodeS3Key
      Tags:
        - Key: Project
          Value: StreamMyCourse
        - Key: Environment
          Value: !Ref Environment

  CognitoCustomEmailSenderLambdaRole:
    Type: AWS::IAM::Role
    Condition: ShouldDeployCustomEmailSender
    Properties:
      RoleName: !Sub '${AWS::StackName}-CustomEmailSenderLambdaRole'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: CloudWatchLogs
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${AWS::StackName}-CustomEmailSender:*'
        - PolicyName: ZohoSmtpSecretRead
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource: !Ref ZohoSmtpSecretArn

  CognitoCustomEmailKmsKey:
    Type: AWS::KMS::Key
    Condition: ShouldDeployCustomEmailSender
    DependsOn:
      - CognitoCustomEmailSenderLambdaRole
    Properties:
      Description: Cognito CustomEmailSender code encryption for StreamMyCourse
      EnableKeyRotation: true
      KeyPolicy:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowRootAdmin
            Effect: Allow
            Principal:
              AWS: !Sub 'arn:aws:iam::${AWS::AccountId}:root'
            Action: kms:*
            Resource: '*'
          - Sid: AllowCognitoEncrypt
            Effect: Allow
            Principal:
              Service: cognito-idp.amazonaws.com
            Action:
              - kms:CreateGrant
              - kms:Encrypt
            Resource: '*'
            Condition:
              StringEquals:
                kms:ViaService: !Sub 'cognito-idp.${AWS::Region}.amazonaws.com'
          - Sid: AllowLambdaDecrypt
            Effect: Allow
            Principal:
              AWS: !GetAtt CognitoCustomEmailSenderLambdaRole.Arn
            Action:
              - kms:Decrypt
            Resource: '*'

  CognitoCustomEmailSenderLambda:
    Type: AWS::Lambda::Function
    Condition: ShouldDeployCustomEmailSender
    DependsOn:
      - CognitoCustomEmailSenderLambdaRole
      - CognitoCustomEmailKmsKey
      - CognitoCustomEmailSenderKmsPolicy
    Properties:
      FunctionName: !Sub '${AWS::StackName}-CustomEmailSender'
      Runtime: python3.11
      Handler: handler.lambda_handler
      Role: !GetAtt CognitoCustomEmailSenderLambdaRole.Arn
      Timeout: 30
      MemorySize: 256
      Environment:
        Variables:
          ZOHO_SMTP_SECRET_ARN: !Ref ZohoSmtpSecretArn
          KMS_KEY_ARN: !GetAtt CognitoCustomEmailKmsKey.Arn
      Code:
        S3Bucket: !Ref CognitoCustomEmailSenderCodeS3Bucket
        S3Key: !Ref CognitoCustomEmailSenderCodeS3Key
      Tags:
        - Key: Project
          Value: StreamMyCourse
        - Key: Environment
          Value: !Ref Environment

  CatalogUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName:
        Fn::Sub: '${AWS::StackName}-users'
      UsernameAttributes:
        - email
      AutoVerifiedAttributes:
        - email
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: false
          RequireUppercase: true
      Schema:
        - Name: role
          AttributeDataType: String
          Mutable: true
          Required: false
        - Name: active_session_id
          AttributeDataType: String
          Mutable: true
          Required: false
      UserAttributeUpdateSettings:
        AttributesRequireVerificationBeforeUpdate: []
      EmailConfiguration:
        EmailSendingAccount: COGNITO_DEFAULT
      VerificationMessageTemplate:
        DefaultEmailOption: CONFIRM_WITH_CODE
        EmailSubject: Verify your Research Spectrum account
        EmailMessage: 'Your verification code is {####}.'
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1
      UserPoolTags:
        Project: StreamMyCourse
        Environment:
          Ref: Environment
      LambdaConfig: !If
        - ShouldDeployUserProfileSyncAndPreSignUp
        - PreSignUp: !GetAtt CognitoPreSignUpLambda.Arn
          PostAuthentication: !GetAtt UserProfileSyncLambda.Arn
          PreTokenGenerationConfig:
            LambdaArn: !GetAtt UserProfileSyncLambda.Arn
            LambdaVersion: V1_0
          CustomEmailSender: !If
            - ShouldDeployCustomEmailSender
            - LambdaArn: !GetAtt CognitoCustomEmailSenderLambda.Arn
              LambdaVersion: V1_0
            - !Ref AWS::NoValue
          KMSKeyID: !If
            - ShouldDeployCustomEmailSender
            - !GetAtt CognitoCustomEmailKmsKey.Arn
            - !Ref AWS::NoValue
        - !If
          - ShouldDeployUserProfileSync
          - PostAuthentication: !GetAtt UserProfileSyncLambda.Arn
            PreTokenGenerationConfig:
              LambdaArn: !GetAtt UserProfileSyncLambda.Arn
              LambdaVersion: V1_0
          - !If
            - ShouldDeployPreSignUp
            - PreSignUp: !GetAtt CognitoPreSignUpLambda.Arn
              CustomEmailSender: !If
                - ShouldDeployCustomEmailSender
                - LambdaArn: !GetAtt CognitoCustomEmailSenderLambda.Arn
                  LambdaVersion: V1_0
                - !Ref AWS::NoValue
              KMSKeyID: !If
                - ShouldDeployCustomEmailSender
                - !GetAtt CognitoCustomEmailKmsKey.Arn
                - !Ref AWS::NoValue
            - !Ref AWS::NoValue

  CognitoPreSignUpLambdaPoolPolicy:
    Type: AWS::IAM::Policy
    Condition: ShouldDeployPreSignUp
    DependsOn:
      - CatalogUserPool
      - CognitoPreSignUpLambdaRole
    Properties:
      PolicyName: CognitoLinkUsers
      Roles:
        - !Ref CognitoPreSignUpLambdaRole
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action:
              - cognito-idp:ListUsers
              - cognito-idp:AdminLinkProviderForUser
            Resource: !GetAtt CatalogUserPool.Arn

  CognitoCustomEmailSenderKmsPolicy:
    Type: AWS::IAM::Policy
    Condition: ShouldDeployCustomEmailSender
    DependsOn:
      - CognitoCustomEmailSenderLambdaRole
      - CognitoCustomEmailKmsKey
    Properties:
      PolicyName: KmsDecryptCustomEmailCodes
      Roles:
        - !Ref CognitoCustomEmailSenderLambdaRole
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action:
              - kms:Decrypt
            Resource: !GetAtt CognitoCustomEmailKmsKey.Arn

  UserProfileSyncLambdaPermission:
    Type: AWS::Lambda::Permission
    Condition: ShouldDeployUserProfileSync
    DependsOn:
      - CatalogUserPool
      - UserProfileSyncLambda
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref UserProfileSyncLambda
      Principal: cognito-idp.amazonaws.com
      SourceArn: !GetAtt CatalogUserPool.Arn

  CognitoPreSignUpLambdaPermission:
    Type: AWS::Lambda::Permission
    Condition: ShouldDeployPreSignUp
    DependsOn:
      - CatalogUserPool
      - CognitoPreSignUpLambda
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref CognitoPreSignUpLambda
      Principal: cognito-idp.amazonaws.com
      SourceArn: !GetAtt CatalogUserPool.Arn

  CognitoCustomEmailSenderLambdaPermission:
    Type: AWS::Lambda::Permission
    Condition: ShouldDeployCustomEmailSender
    DependsOn:
      - CatalogUserPool
      - CognitoCustomEmailSenderLambda
      - CognitoCustomEmailSenderKmsPolicy
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref CognitoCustomEmailSenderLambda
      Principal: cognito-idp.amazonaws.com
      SourceArn: !GetAtt CatalogUserPool.Arn

  GoogleIdentityProvider:
    Type: AWS::Cognito::UserPoolIdentityProvider
    DependsOn:
      - CatalogUserPool
    Properties:
      ProviderName: Google
      ProviderType: Google
      UserPoolId:
        Ref: CatalogUserPool
      ProviderDetails:
        client_id:
          Ref: GoogleClientId
        client_secret:
          Ref: GoogleClientSecret
        authorize_scopes: 'openid email profile'
      AttributeMapping:
        email: email
        email_verified: email_verified
        given_name: given_name
        family_name: family_name
        name: name
        picture: picture

  StudentUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    DependsOn:
      - CatalogUserPool
      - GoogleIdentityProvider
    Properties:
      ClientName:
        Fn::Sub: 'streammycourse-student-${Environment}'
      UserPoolId:
        Ref: CatalogUserPool
      GenerateSecret: false
      # ALLOW_ADMIN_USER_PASSWORD_AUTH enables server-side AdminInitiateAuth for CI
      # tokens (e.g. CI mint or COGNITO_RDS_VERIFY_JWT on the GitHub Environment) without exposing USER_PASSWORD_AUTH on the public client.
      ExplicitAuthFlows:
        - ALLOW_REFRESH_TOKEN_AUTH
        - ALLOW_ADMIN_USER_PASSWORD_AUTH
        - ALLOW_USER_SRP_AUTH
      SupportedIdentityProviders:
        - COGNITO
        - Google
      PreventUserExistenceErrors: ENABLED
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows:
        - code
      AllowedOAuthScopes:
        # Required for Cognito GetUser / Amplify fetchUserAttributes with the access token (OAuth code flow).
        - aws.cognito.signin.user.admin
        - openid
        - email
        - profile
      CallbackURLs:
        Fn::Split:
          - ','
          - Ref: StudentCallbackUrls
      LogoutURLs:
        Fn::Split:
          - ','
          - Ref: StudentLogoutUrls
      AccessTokenValidity: 60
      IdTokenValidity: 60
      RefreshTokenValidity: 30
      EnableTokenRevocation: true
      TokenValidityUnits:
        AccessToken: minutes
        IdToken: minutes
        RefreshToken: days

  TeacherUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    DependsOn:
      - CatalogUserPool
      - GoogleIdentityProvider
    Properties:
      ClientName:
        Fn::Sub: 'streammycourse-teacher-${Environment}'
      UserPoolId:
        Ref: CatalogUserPool
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_REFRESH_TOKEN_AUTH
        - ALLOW_ADMIN_USER_PASSWORD_AUTH
      SupportedIdentityProviders:
        - Google
      PreventUserExistenceErrors: ENABLED
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows:
        - code
      AllowedOAuthScopes:
        # Same as student client: GetUser / Amplify fetchUserAttributes needs this scope on the access token.
        - aws.cognito.signin.user.admin
        - openid
        - email
        - profile
      CallbackURLs:
        Fn::Split:
          - ','
          - Ref: TeacherCallbackUrls
      LogoutURLs:
        Fn::Split:
          - ','
          - Ref: TeacherLogoutUrls
      AccessTokenValidity: 60
      IdTokenValidity: 60
      RefreshTokenValidity: 30
      TokenValidityUnits:
        AccessToken: minutes
        IdToken: minutes
        RefreshToken: days

  CatalogUserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      Domain:
        Ref: CognitoDomainPrefix
      UserPoolId:
        Ref: CatalogUserPool

Outputs:
  UserPoolId:
    Description: Cognito User Pool ID
    Value:
      Ref: CatalogUserPool
    Export:
      Name:
        Fn::Sub: '${AWS::StackName}-UserPoolId'

  UserPoolArn:
    Description: Cognito User Pool ARN (for API Gateway authorizer)
    Value:
      Fn::GetAtt: CatalogUserPool.Arn
    Export:
      Name:
        Fn::Sub: '${AWS::StackName}-UserPoolArn'

  HostedUIDomain:
    Description: Hosted UI domain host (use with https:// prefix for Amplify oauth.domain)
    Value:
      Fn::Sub: '${CognitoDomainPrefix}.auth.${AWS::Region}.amazoncognito.com'

  StudentUserPoolClientId:
    Description: App client ID for student SPA
    Value:
      Ref: StudentUserPoolClient

  TeacherUserPoolClientId:
    Description: App client ID for teacher SPA
    Value:
      Ref: TeacherUserPoolClient
