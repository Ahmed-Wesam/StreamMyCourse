AWSTemplateFormatVersion: '2010-09-09'
Description: 'StreamMyCourse - MVP API Stack (API Gateway + Lambda, no event sources)'

Parameters:
  Environment:
    Type: String
    AllowedValues: [prod]
    Default: prod
    Description: Deployment environment

  CorsAllowOrigin:
    Type: String
    Default: 'http://localhost:5173'
    Description: Allowed CORS origins for Lambda success responses (CSV supported; e.g., "https://researchspectrum.org,http://localhost:5173")

  GatewayResponseAllowOrigin:
    Type: String
    Default: 'http://localhost:5173'
    Description: Single CORS origin for API Gateway error responses (must be a single value, not CSV). Avoid '*' in production.

  DefaultMp4Url:
    Type: String
    Default: 'https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4'
    Description: Default MP4 URL for playback (override in prod)

  VideoUrl:
    Type: String
    Default: ''
    Description: Real video URL from CloudFront (S3 hosted)

  VideoBucketName:
    Type: String
    Default: ''
    Description: S3 bucket name used for video uploads (presigned PUT)

  LambdaCodeS3Bucket:
    Type: String
    Default: ''
    Description: S3 bucket that contains the Lambda deployment zip

  LambdaCodeS3Key:
    Type: String
    Default: ''
    Description: S3 key for the Lambda deployment zip

  TokenAuthorizerCodeS3Key:
    Type: String
    MinLength: 1
    Description: S3 key for the TOKEN authorizer Lambda deployment zip (required)

  CognitoUserPoolArn:
    Type: String
    MinLength: 1
    Description: Cognito User Pool ARN for API Gateway COGNITO_USER_POOLS authorizer (required)

  CognitoClientId:
    Type: String
    MinLength: 1
    Description: >-
      Cognito User Pool Client ID(s) for JWT audience validation.
      Supports comma-separated list for multiple clients (e.g., student + teacher apps).
      Required for public route JWT verification.

  StudentCognitoClientId:
    Type: String
    Default: ''
    Description: >-
      Student app client ID for catalog single-session enforcement (STUDENT_COGNITO_CLIENT_ID).
      Empty disables the API middleware check until wired by deploy.

  RdsStackName:
    Type: String
    MinLength: 1
    Description: >-
      Name of the RDS stack (e.g. StreamMyCourse-Rds-prod) whose exports provide
      the VPC/subnet/SG/secret and DB_* settings for the catalog Lambda (required).

  LogLevel:
    Type: String
    Default: 'INFO'
    AllowedValues:
      - 'DEBUG'
      - 'INFO'
      - 'WARNING'
      - 'ERROR'
      - 'CRITICAL'
    Description: Log level for Lambda function (DEBUG, INFO, WARNING, ERROR, CRITICAL)

  MediaCleanupQueueUrl:
    Type: String
    Default: ''
    Description: >-
      SQS queue URL for async S3 media cleanup after course delete. When empty,
      the catalog uses synchronous S3 deletes (legacy rollout only).

  MediaCleanupQueueArn:
    Type: String
    Default: ''
    Description: >-
      SQS queue ARN for sqs:SendMessage on the catalog Lambda role. Must be set
      when MediaCleanupQueueUrl is set.

  TransactionalMailQueueUrl:
    Type: String
    Default: ''
    Description: >-
      SQS queue URL for async transactional mail (contact form). When empty,
      POST /contact returns service unavailable.

  TransactionalMailQueueArn:
    Type: String
    Default: ''
    Description: >-
      SQS queue ARN for sqs:SendMessage on the catalog Lambda role. Must be set
      when TransactionalMailQueueUrl is set.

  BillingEdgeLambdaArn:
    Type: String
    Default: ''
    Description: >-
      ARN of the billing edge Lambda from StreamMyCourse-Payments-{env}. When
      empty, billing routes are not attached to this API.

  VideoProviderEdgeLambdaArn:
    Type: String
    Default: ''
    Description: >-
      ARN of the video provider edge Lambda from StreamMyCourse-VideoProviderEdge-{env}.
      When set with VideoProvider=kinescope, upload/webhook routes target the edge.

  BillingTeacherSub:
    Type: String
    Default: ''
    Description: >-
      Cognito sub of the platform billing teacher; catalog uses this for
      GET /billing/merchant/status authorization.

  ProgressCompleteRatio:
    Type: Number
    Default: 0.92
    MinValue: 0.01
    MaxValue: 1.0
    Description: Ratio of video watched to auto-mark lesson complete

  ProgressPositionSlackSec:
    Type: Number
    Default: 30
    MinValue: 0
    Description: Seconds past video end to allow position reporting

  RateLimitMaxOverrides:
    Type: String
    Default: ''
    Description: >-
      Optional CSV of policy_id:max_count overrides (e.g. progress.lesson:10).
      Empty uses built-in policy defaults.

  CatalogApi4xxAlarmThreshold:
    Type: Number
    Default: 500
    MinValue: 1
    Description: >-
      Sum of API Gateway 4XXError on the catalog stage per 5-minute period before
      CloudWatch alarm (tune at deploy if needed).

  KinescopeDrmJwtSecret:
    Type: String
    Default: ''
    NoEcho: true
    Description: Secret key used to sign and verify Kinescope DRM JWTs

  VideoProvider:
    Type: String
    Default: s3
    AllowedValues:
      - s3
      - kinescope
      - vdocipher
    Description: Active video provider used by catalog upload/playback services

  KinescopeApiToken:
    Type: String
    Default: ''
    NoEcho: true
    Description: Kinescope API token for upload init + provider integration

  KinescopeParentId:
    Type: String
    Default: ''
    Description: Kinescope parent/container id used during upload init

  KinescopeDrmJwtIssuer:
    Type: String
    Default: 'streammycourse'
    Description: Issuer claim for Kinescope DRM JWTs

  KinescopeDrmJwtAudience:
    Type: String
    Default: 'kinescope'
    Description: Audience claim for Kinescope DRM JWTs

  KinescopeWebhookSecret:
    Type: String
    Default: ''
    NoEcho: true
    Description: >-
      Shared secret for POST /webhooks/kinescope (query ?token= or header
      X-Kinescope-Webhook-Secret). Empty disables secret check.

Conditions:
  HasVideoBucket: !Not [!Equals [!Ref VideoBucketName, '']]
  HasMediaCleanupQueueArn: !Not [!Equals [!Ref MediaCleanupQueueArn, '']]
  HasTransactionalMailQueueArn: !Not [!Equals [!Ref TransactionalMailQueueArn, '']]
  HasBillingEdgeLambdaArn: !Not [!Equals [!Ref BillingEdgeLambdaArn, '']]
  IsKinescopeProvider: !Equals [!Ref VideoProvider, kinescope]
  HasVideoProviderEdgeLambdaArn: !Not [!Equals [!Ref VideoProviderEdgeLambdaArn, '']]
  UseKinescopeVideoEdge: !And
    - !Condition IsKinescopeProvider
    - !Condition HasVideoProviderEdgeLambdaArn

Resources:
  # Lambda Execution Role
  CatalogLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'StreamMyCourse-CatalogLambdaRole-${Environment}'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: CloudWatchLogs
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/StreamMyCourse-Catalog-${Environment}:*'
        - PolicyName: S3PresignedUrl
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:DeleteObject
                Resource: !If
                  - HasVideoBucket
                  - !Sub 'arn:aws:s3:::${VideoBucketName}/*'
                  # Non-existent bucket prefix: avoids account-wide s3:* on all buckets when param is empty.
                  - 'arn:aws:s3:::streammycourse-no-bucket-configured/NEVER_MATCH/*'
              - Effect: Allow
                Action:
                  - s3:GetObject
                Resource: !If
                  - HasVideoBucket
                  - - !Sub 'arn:aws:s3:::${VideoBucketName}/*/thumbnail/*'
                    - !Sub 'arn:aws:s3:::${VideoBucketName}/*/lessons/*/thumbnail/*'
                    # Presigned playback GET: signer (catalog role) must be allowed GetObject on video keys.
                    - !Sub 'arn:aws:s3:::${VideoBucketName}/*/lessons/*/video/*'
                    - !Sub 'arn:aws:s3:::${VideoBucketName}/*/lessons/*/files/*'
                    - !Sub 'arn:aws:s3:::${VideoBucketName}/*/assignments/*'
                  - - 'arn:aws:s3:::streammycourse-no-bucket-configured/NEVER_MATCH/*'
        - !If
          - HasMediaCleanupQueueArn
          - PolicyName: SqsMediaCleanupSend
            PolicyDocument:
              Version: '2012-10-17'
              Statement:
                - Effect: Allow
                  Action:
                    - sqs:SendMessage
                  Resource: !Ref MediaCleanupQueueArn
          - !Ref AWS::NoValue
        - !If
          - HasTransactionalMailQueueArn
          - PolicyName: SqsTransactionalMailSend
            PolicyDocument:
              Version: '2012-10-17'
              Statement:
                - Effect: Allow
                  Action:
                    - sqs:SendMessage
                  Resource: !Ref TransactionalMailQueueArn
          - !Ref AWS::NoValue
        # VPC ENI lifecycle for Lambda-in-VPC. These actions are resource-less by
        # AWS design (they return IDs from the global EC2 API) — standard for the
        # Lambda-in-VPC pattern.
        - PolicyName: LambdaVpcEni
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - ec2:CreateNetworkInterface
                  - ec2:DescribeNetworkInterfaces
                  - ec2:DeleteNetworkInterface
                  - ec2:AssignPrivateIpAddresses
                  - ec2:UnassignPrivateIpAddresses
                Resource: '*'
        # Scoped to the specific RDS credentials secret exported by the RDS stack.
        - PolicyName: SecretsManagerRdsCreds
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource: !ImportValue
                  'Fn::Sub': '${RdsStackName}-DbSecretArn'
      Tags:
        - Key: Project
          Value: StreamMyCourse
        - Key: Environment
          Value: !Ref Environment

  # Lambda Function
  CatalogLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub 'StreamMyCourse-Catalog-${Environment}'
      Runtime: python3.11
      Handler: index.lambda_handler
      # Bumped from 15s to 30s to absorb VPC cold-start (~1-2s ENI attach) and
      # Secrets Manager fetch (~0.5-1s on cold start).
      Timeout: 30
      MemorySize: 512
      Role: !GetAtt CatalogLambdaRole.Arn
      Code:
        S3Bucket: !Ref LambdaCodeS3Bucket
        S3Key: !Ref LambdaCodeS3Key
      VpcConfig:
        SubnetIds:
          - !ImportValue
            'Fn::Sub': '${RdsStackName}-PrivateSubnetId'
        SecurityGroupIds:
          - !ImportValue
            'Fn::Sub': '${RdsStackName}-LambdaSecurityGroupId'
      Environment:
        Variables:
          DEFAULT_MP4_URL: !Ref DefaultMp4Url
          VIDEO_URL: !Ref VideoUrl
          VIDEO_BUCKET: !Ref VideoBucketName
          ALLOWED_ORIGINS: !Ref CorsAllowOrigin
          LOG_LEVEL: !Ref LogLevel
          DB_HOST: !ImportValue
            'Fn::Sub': '${RdsStackName}-DbHost'
          DB_PORT: !ImportValue
            'Fn::Sub': '${RdsStackName}-DbPort'
          DB_NAME: !ImportValue
            'Fn::Sub': '${RdsStackName}-DbName'
          DB_SECRET_ARN: !ImportValue
            'Fn::Sub': '${RdsStackName}-DbSecretArn'
          MEDIA_CLEANUP_QUEUE_URL: !Ref MediaCleanupQueueUrl
          TRANSACTIONAL_MAIL_QUEUE_URL: !Ref TransactionalMailQueueUrl
          BILLING_TEACHER_SUB: !Ref BillingTeacherSub
          DEPLOYMENT_ENVIRONMENT: !Ref Environment
          PROGRESS_COMPLETE_RATIO: !Ref ProgressCompleteRatio
          PROGRESS_POSITION_SLACK_SEC: !Ref ProgressPositionSlackSec
          RATE_LIMIT_MAX_OVERRIDES: !Ref RateLimitMaxOverrides
          STUDENT_COGNITO_CLIENT_ID: !Ref StudentCognitoClientId
          VIDEO_PROVIDER: !Ref VideoProvider
          KINESCOPE_API_TOKEN: !If
            - UseKinescopeVideoEdge
            - ''
            - !Ref KinescopeApiToken
          KINESCOPE_PARENT_ID: !If
            - UseKinescopeVideoEdge
            - ''
            - !Ref KinescopeParentId
          KINESCOPE_DRM_JWT_SECRET: !Ref KinescopeDrmJwtSecret
          KINESCOPE_DRM_JWT_ISSUER: !Ref KinescopeDrmJwtIssuer
          KINESCOPE_DRM_JWT_AUDIENCE: !Ref KinescopeDrmJwtAudience
          KINESCOPE_WEBHOOK_SECRET: !If
            - UseKinescopeVideoEdge
            - ''
            - !Ref KinescopeWebhookSecret
      Tags:
        - Key: Project
          Value: StreamMyCourse
        - Key: Environment
          Value: !Ref Environment

  TokenAuthorizerLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'StreamMyCourse-CatalogTokenAuthorizerRole-${Environment}'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: CloudWatchLogs
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/StreamMyCourse-CatalogTokenAuthorizer-${Environment}:*'
      Tags:
        - Key: Project
          Value: StreamMyCourse
        - Key: Environment
          Value: !Ref Environment

  TokenAuthorizerLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub 'StreamMyCourse-CatalogTokenAuthorizer-${Environment}'
      Runtime: python3.11
      Handler: index.lambda_handler
      Timeout: 10
      MemorySize: 256
      Role: !GetAtt TokenAuthorizerLambdaRole.Arn
      Code:
        S3Bucket: !Ref LambdaCodeS3Bucket
        S3Key: !Ref TokenAuthorizerCodeS3Key
      Environment:
        Variables:
          LOG_LEVEL: !Ref LogLevel
          COGNITO_USER_POOL_ARN: !Ref CognitoUserPoolArn
          COGNITO_CLIENT_ID: !Ref CognitoClientId
      Tags:
        - Key: Project
          Value: StreamMyCourse
        - Key: Environment
          Value: !Ref Environment

  # API Gateway REST API
  CatalogApi:
    Type: AWS::ApiGateway::RestApi
    Properties:
      Name: !Sub 'StreamMyCourse-Catalog-${Environment}'
      Description: MVP Catalog API
      EndpointConfiguration:
        Types:
          - REGIONAL
      Tags:
        - Key: Project
          Value: StreamMyCourse
        - Key: Environment
          Value: !Ref Environment

  TokenAuthorizerLambdaApiPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref TokenAuthorizerLambda
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${CatalogApi}/authorizers/*'

  CatalogApiTokenAuthorizer:
    Type: AWS::ApiGateway::Authorizer
    Properties:
      Name: !Sub 'StreamMyCourse-CognitoAuthorizer-${Environment}'
      Type: COGNITO_USER_POOLS
      RestApiId: !Ref CatalogApi
      IdentitySource: method.request.header.Authorization
      AuthorizerResultTtlInSeconds: 300
      ProviderARNs:
        - !Ref CognitoUserPoolArn

  # Permissive JWT authorizer for public catalog reads (GET course / modules / lessons).
  # Always returns Allow: no Authorization, bad, or non–id-token JWT → anonymous context;
  # valid Cognito Id token → sub/role/email in context for Lambda (same handler as token zip).
  # Identity must not be Authorization-only: absent header ⇒ API GW 401 before Lambda. REST
  # REQUEST authorizers only allow header/querystring/stage/context expressions (not path.*);
  # `method.request.header.Host` is always present on HTTP/1.1 so the authorizer always runs.
  # Handler still reads Bearer from `Authorization` when present.
  #
  # Caching MUST be disabled (TTL 0): the cache key is derived from IdentitySource values only,
  # not Authorization. Same Host (+ optional TTL>0) would collapse anonymous vs Bearer policies.
  CatalogApiPublicReadAuthorizer:
    Type: AWS::ApiGateway::Authorizer
    Properties:
      Name: !Sub 'StreamMyCourse-PublicCatalogRead-${Environment}'
      Type: REQUEST
      RestApiId: !Ref CatalogApi
      AuthorizerUri: !Sub 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${TokenAuthorizerLambda.Arn}/invocations'
      AuthorizerResultTtlInSeconds: 0
      IdentitySource: method.request.header.Host

  # API Gateway GatewayResponses to guarantee CORS headers even on errors (e.g., 4XX/5XX)
  # Note: GatewayResponseAllowOrigin must be a single value (not CSV) for API Gateway to accept it
  ApiGatewayResponseDefault4XX:
    Type: AWS::ApiGateway::GatewayResponse
    Properties:
      RestApiId: !Ref CatalogApi
      ResponseType: DEFAULT_4XX
      ResponseParameters:
        gatewayresponse.header.Access-Control-Allow-Origin: !Sub "'${GatewayResponseAllowOrigin}'"
        gatewayresponse.header.Access-Control-Allow-Methods: "'GET,POST,PUT,PATCH,DELETE,OPTIONS'"
        gatewayresponse.header.Access-Control-Allow-Headers: "'Content-Type,Authorization'"

  ApiGatewayResponseDefault5XX:
    Type: AWS::ApiGateway::GatewayResponse
    Properties:
      RestApiId: !Ref CatalogApi
      ResponseType: DEFAULT_5XX
      ResponseParameters:
        gatewayresponse.header.Access-Control-Allow-Origin: !Sub "'${GatewayResponseAllowOrigin}'"
        gatewayresponse.header.Access-Control-Allow-Methods: "'GET,POST,PUT,PATCH,DELETE,OPTIONS'"
        gatewayresponse.header.Access-Control-Allow-Headers: "'Content-Type,Authorization'"

  # API Gateway Resource: /courses
  CoursesResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref CatalogApi
      ParentId: !GetAtt CatalogApi.RootResourceId
      PathPart: courses

  # API Gateway Resource: /courses/mine (instructor-owned courses incl. drafts)
  CoursesMineResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref CatalogApi
      ParentId: !Ref CoursesResource
      PathPart: mine

  # API Gateway Resource: /courses/{courseId}
  CourseIdResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref CatalogApi
      ParentId: !Ref CoursesResource
      PathPart: '{courseId}'


  # API Gateway Resource: /courses/{courseId}/assignments
  CourseAssignmentsResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref CatalogApi
      ParentId: !Ref CourseIdResource
      PathPart: assignments

  # API Gateway Resource: /courses/{courseId}/certificates
  CourseCertificatesResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref CatalogApi
      ParentId: !Ref CourseIdResource
      PathPart: certificates

  # API Gateway Resource: /courses/{courseId}/certificates/{certificateId}
  CourseCertificateIdResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref CatalogApi
      ParentId: !Ref CourseCertificatesResource
      PathPart: '{certificateId}'

  # API Gateway Resource: /courses/{courseId}/certificates/{certificateId}/revoke
  CourseCertificateRevokeResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref CatalogApi
      ParentId: !Ref CourseCertificateIdResource
      PathPart: revoke

  # API Gateway Resource: /courses/{courseId}/assignments/{assignmentId}
  CourseAssignmentIdResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref CatalogApi
      ParentId: !Ref CourseAssignmentsResource
      PathPart: '{assignmentId}'

  # API Gateway Resource: /courses/{courseId}/assignments/{assignmentId}/images
  CourseAssignmentImagesResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref CatalogApi
      ParentId: !Ref CourseAssignmentIdResource
      PathPart: images

  # API Gateway Resource: /courses/{courseId}/assignments/{assignmentId}/images/{slot}
  CourseAssignmentImageSlotResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref CatalogApi
      ParentId: !Ref CourseAssignmentImagesResource
      PathPart: '{slot}'

  # API Gateway Resource: .../images/{slot}/complete
  CourseAssignmentImageCompleteResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref CatalogApi
      ParentId: !Ref CourseAssignmentImageSlotResource
      PathPart: complete

  # API Gateway Resource: .../images/{slot}/url
  CourseAssignmentImageUrlResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref CatalogApi
      ParentId: !Ref CourseAssignmentImageSlotResource
      PathPart: url

  # API Gateway Resource: /courses/{courseId}/assignments/{assignmentId}/submissions
  CourseAssignmentSubmissionsResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref CatalogApi
      ParentId: !Ref CourseAssignmentIdResource
      PathPart: submissions

  # API Gateway Resource: .../submissions/{submissionId}
  CourseAssignmentSubmissionIdResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref CatalogApi
      ParentId: !Ref CourseAssignmentSubmissionsResource
      PathPart: '{submissionId}'

  # API Gateway Resource: .../submissions/{submissionId}/files
  CourseAssignmentSubmissionFilesResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref CatalogApi
      ParentId: !Ref CourseAssignmentSubmissionIdResource
      PathPart: files

  # API Gateway Resource: .../files/{fileId}
  CourseAssignmentSubmissionFileIdResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref CatalogApi
      ParentId: !Ref CourseAssignmentSubmissionFilesResource
      PathPart: '{fileId}'

  # API Gateway Resource: .../files/{fileId}/complete
  CourseAssignmentSubmissionFileCompleteResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref CatalogApi
      ParentId: !Ref CourseAssignmentSubmissionFileIdResource
      PathPart: complete

  # API Gateway Resource: .../files/{fileId}/url
  CourseAssignmentSubmissionFileUrlResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref CatalogApi
      ParentId: !Ref CourseAssignmentSubmissionFileIdResource
      PathPart: url

  # API Gateway Resource: .../submissions/{submissionId}/submit
  CourseAssignmentSubmitResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref CatalogApi
      ParentId: !Ref CourseAssignmentSubmissionIdResource
      PathPart: submit

  # API Gateway Resource: .../submissions/{submissionId}/grade
  CourseAssignmentGradeResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref CatalogApi
      ParentId: !Ref CourseAssignmentSubmissionIdResource
      PathPart: grade

  # API Gateway Resource: /courses/{courseId}/enroll
  CourseEnrollResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref CatalogApi
      ParentId: !Ref CourseIdResource
      PathPart: enroll

  # API Gateway Resource: /courses/{courseId}/modules
  CourseModulesResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref CatalogApi
      ParentId: !Ref CourseIdResource
      PathPart: modules

  # API Gateway Resource: /courses/{courseId}/modules/{moduleId}
  CourseModuleIdResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref CatalogApi
      ParentId: !Ref CourseModulesResource
      PathPart: '{moduleId}'

  # API Gateway Resource: /courses/{courseId}/question-banks
  CourseQuestionBanksResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref CatalogApi
      ParentId: !Ref CourseIdResource
      PathPart: question-banks

  # API Gateway Resource: /courses/{courseId}/module-quizzes
  CourseModuleQuizzesResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref CatalogApi
      ParentId: !Ref CourseIdResource
      PathPart: module-quizzes

  # API Gateway Resource: /courses/{courseId}/question-banks/{questionBankId}
  CourseQuestionBankIdResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref CatalogApi
      ParentId: !Ref CourseQuestionBanksResource
      PathPart: '{questionBankId}'

  # API Gateway Resource: /courses/{courseId}/question-banks/{questionBankId}/publish
  CourseQuestionBankPublishResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref CatalogApi
      ParentId: !Ref CourseQuestionBankIdResource
      PathPart: publish

  # API Gateway Resource: /courses/{courseId}/question-banks/{questionBankId}/questions
  CourseQuestionBankQuestionsResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref CatalogApi
      ParentId: !Ref CourseQuestionBankIdResource
      PathPart: questions

  # API Gateway Resource: /courses/{courseId}/question-banks/{questionBankId}/questions/{questionId}
  CourseQuestionBankQuestionIdResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref CatalogApi
      ParentId: !Ref CourseQuestionBankQuestionsResource
      PathPart: '{questionId}'

  # API Gateway Resource: /courses/{courseId}/modules/{moduleId}/quiz
  CourseModuleQuizResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref CatalogApi
      ParentId: !Ref CourseModuleIdResource
      PathPart: quiz

  # API Gateway Resource: /courses/{courseId}/modules/{moduleId}/quiz/start
  CourseModuleQuizStartResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref CatalogApi
      ParentId: !Ref CourseModuleQuizResource
      PathPart: start

  # API Gateway Resource: /courses/{courseId}/modules/{moduleId}/quiz/submit
  CourseModuleQuizSubmitResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref CatalogApi
      ParentId: !Ref CourseModuleQuizResource
      PathPart: submit

