  # API Gateway Stage
  CatalogApiStage:
    Type: AWS::ApiGateway::Stage
    Properties:
      RestApiId: !Ref CatalogApi
      DeploymentId: !Ref CatalogApiDeploymentV43
      StageName: !Ref Environment
      Description: !Sub '${Environment} stage for Catalog API'
      MethodSettings:
        # API Gateway rejects ResourcePath + HttpMethod '*' when the path ends with '/*'
        # (becomes an invalid webhooks/*/* key). List each public webhook POST explicitly.
        - ResourcePath: '/webhooks/kinescope'
          HttpMethod: 'POST'
          ThrottlingRateLimit: 50
          ThrottlingBurstLimit: 100
        - ResourcePath: '/webhooks/kinescope/drm-auth'
          HttpMethod: 'POST'
          ThrottlingRateLimit: 50
          ThrottlingBurstLimit: 100
        - ResourcePath: '/webhooks/payments/paytabs'
          HttpMethod: 'POST'
          ThrottlingRateLimit: 50
          ThrottlingBurstLimit: 100
        - ResourcePath: '/courses/*/lessons/*/progress'
          HttpMethod: 'PUT'
          ThrottlingRateLimit: 30
          ThrottlingBurstLimit: 60
        - ResourcePath: '/playback/*'
          HttpMethod: 'GET'
          ThrottlingRateLimit: 40
          ThrottlingBurstLimit: 80
        - ResourcePath: '/contact'
          HttpMethod: 'POST'
          ThrottlingRateLimit: 20
          ThrottlingBurstLimit: 40
        - ResourcePath: '/courses'
          HttpMethod: 'GET'
          ThrottlingRateLimit: 40
          ThrottlingBurstLimit: 80
          MetricsEnabled: true
        - ResourcePath: '/courses/*'
          HttpMethod: 'GET'
          ThrottlingRateLimit: 40
          ThrottlingBurstLimit: 80
        - ResourcePath: '/*'
          HttpMethod: '*'
          ThrottlingRateLimit: 100
          ThrottlingBurstLimit: 200
          MetricsEnabled: true

  CatalogApi4xxAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub 'StreamMyCourse-CatalogApi-${Environment}-4XX'
      AlarmDescription: >-
        Catalog API stage 4XX spike (client errors, gateway throttles).
        Lambda rate-limit denials log rate_limit_denied; filter CloudWatch Logs on that key.
      Namespace: AWS/ApiGateway
      MetricName: 4XXError
      Dimensions:
        - Name: ApiName
          Value: !Sub 'StreamMyCourse-Catalog-${Environment}'
        - Name: Stage
          Value: !Ref Environment
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 2
      Threshold: !Ref CatalogApi4xxAlarmThreshold
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      Tags:
        - Key: Project
          Value: StreamMyCourse
        - Key: Environment
          Value: !Ref Environment

Outputs:
  ApiEndpoint:
    Description: API Gateway endpoint URL
    Value: !Sub 'https://${CatalogApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}'

  LambdaFunctionName:
    Description: Lambda function name
    Value: !Ref CatalogLambda

  TokenAuthorizerLambdaFunctionName:
    Description: Token authorizer Lambda function name
    Value: !Ref TokenAuthorizerLambda

  CatalogApi4xxAlarmName:
    Description: CloudWatch alarm name for catalog stage 4XXError spikes
    Value: !Ref CatalogApi4xxAlarm
