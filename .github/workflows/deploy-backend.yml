# After CI succeeds on a push to main: CI gate → Deploy dev → integration tests
# against the dev API → prod edge + DSQL cluster (parallel) → dsql-compat-spike →
# apply-dsql-schema → deploy-backend-prod → prod SPAs.
# Prod jobs do not start unless the dev integration tests pass.
# Manual dispatch: runs the same order without waiting for upstream CI (operator responsibility).
#
# Lambda zip is uploaded to catalog-{env}-{gitSha}.zip so LambdaCodeS3Key changes every commit
# (CFN updates the function).
# For prod, scripts/deploy-backend.sh deploys StreamMyCourse-MediaCleanup-prod (SQS + worker),
# StreamMyCourse-TransactionalMail-prod (contact mail worker), and StreamMyCourse-Payments-prod
# (billing edge + fulfillment queue) before the API stack, then passes queue URL/ARNs and billing
# edge ARN into api-stack.yaml. Transactional mail zip/deploy runs inside deploy-backend.sh (same
# as media cleanup); ZOHO_SMTP_SECRET_ARN is passed from the Ensure Zoho SMTP secret step.
name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types:
      - completed
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

# One unified deploy at a time per branch; newer pushes wait for the current run to finish.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: eu-west-1

jobs:
  gate:
    name: CI gate
    runs-on: ubuntu-latest
    outputs:
      should_deploy: ${{ steps.pick.outputs.should_deploy }}
      checkout_sha: ${{ steps.pick.outputs.checkout_sha }}
    steps:
      - id: pick
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
            echo "checkout_sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${{ github.event.workflow_run.conclusion }}" != "success" ]; then
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
            echo "checkout_sha=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
            echo "Skipping deploy: CI workflow result was ${{ github.event.workflow_run.conclusion }}"
            exit 0
          fi
          if [ "${{ github.event.workflow_run.event }}" != "push" ]; then
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
            echo "checkout_sha=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
            echo "Skipping deploy: CI was not triggered by push (event=${{ github.event.workflow_run.event }})"
            exit 0
          fi
          if [ "${{ github.event.workflow_run.head_branch }}" != "main" ]; then
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
            echo "checkout_sha=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
            echo "Skipping deploy: CI head branch is not main (${{ github.event.workflow_run.head_branch }})"
            exit 0
          fi
          echo "should_deploy=true" >> "$GITHUB_OUTPUT"
          echo "checkout_sha=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"

  # Pin repo-level OIDC role ARN here (no `environment:`) so jobs that use `environment: prod` for
  # Cognito secrets can still assume the backend deploy role without Environment var shadowing.
  resolve-oidc-deploy-role:
    name: Resolve repo OIDC deploy role ARN
    runs-on: ubuntu-latest
    needs: gate
    if: needs.gate.outputs.should_deploy == 'true'
    outputs:
      aws_deploy_role_arn: ${{ steps.pin.outputs.arn }}
    steps:
      - id: pin
        run: |
          echo "arn=${{ vars.AWS_DEPLOY_ROLE_ARN }}" >> "$GITHUB_OUTPUT"

  deploy-dev-stage:
    name: Deploy dev
    needs: [gate, resolve-oidc-deploy-role]
    if: |
      always() &&
      needs.gate.outputs.should_deploy == 'true' &&
      needs.resolve-oidc-deploy-role.result == 'success' &&
      (github.event_name == 'workflow_run' || github.event_name == 'workflow_dispatch')
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/deploy-dev.yml
    secrets: inherit
    with:
      checkout_ref: ${{ needs.gate.outputs.checkout_sha }}

  # Prod starts only after the dev API has passed the integration suite.

  deploy-edge-prod:
    name: Edge (prod) — ACM cert + student + teacher web CF
    runs-on: ubuntu-latest
    environment: prod
    needs: [gate, integration-http-tests]
    permissions:
      id-token: write
      contents: read
    if: |
      always() && needs.gate.outputs.should_deploy == 'true' &&
      needs.integration-http-tests.result == 'success' &&
      (github.event_name == 'workflow_run' || github.event_name == 'workflow_dispatch')
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.gate.outputs.checkout_sha }}

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy unified edge hosting (us-east-1)
        env:
          ROUTE53_HOSTED_ZONE_ID: ${{ vars.ROUTE53_HOSTED_ZONE_ID }}
          STUDENT_WEB_DOMAIN: ${{ vars.STUDENT_WEB_DOMAIN }}
          TEACHER_WEB_DOMAIN: ${{ vars.TEACHER_WEB_DOMAIN }}
          WEB_CERT_DOMAIN: ${{ vars.WEB_CERT_DOMAIN }}
          WEB_CERT_SANS: ${{ vars.WEB_CERT_SANS }}
        run: |
          chmod +x scripts/deploy-edge.sh
          ./scripts/deploy-edge.sh prod

      - name: Summary
        if: success()
        run: |
          echo "## Edge (prod)" >> "$GITHUB_STEP_SUMMARY"
          echo "**ACM + S3 + CloudFront** in **us-east-1** (StreamMyCourse-EdgeHosting-prod) deployed or no-op changeset." >> "$GITHUB_STEP_SUMMARY"

  # --- Aurora DSQL (prod cluster); failures fail the workflow run.

  deploy-dsql-prod:
    name: DSQL cluster (prod)
    runs-on: ubuntu-latest
    environment: prod
    needs: [gate, integration-http-tests]
    permissions:
      id-token: write
      contents: read
    if: |
      always() && needs.gate.outputs.should_deploy == 'true' &&
      needs.integration-http-tests.result == 'success' &&
      (github.event_name == 'workflow_run' || github.event_name == 'workflow_dispatch')
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.gate.outputs.checkout_sha }}

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy DSQL stack (prod)
        run: |
          set -euo pipefail
          STACK="StreamMyCourse-Dsql-prod"
          REGION="${{ env.AWS_REGION }}"
          aws cloudformation validate-template \
            --template-body "file://${{ github.workspace }}/infrastructure/templates/dsql-stack.yaml" \
            --region "$REGION"
          aws cloudformation deploy \
            --template-file "${{ github.workspace }}/infrastructure/templates/dsql-stack.yaml" \
            --stack-name "$STACK" \
            --capabilities CAPABILITY_IAM \
            --region "$REGION" \
            --no-fail-on-empty-changeset

      - name: Summary
        if: success()
        run: |
          echo "## DSQL cluster (prod)" >> "$GITHUB_STEP_SUMMARY"
          echo "**StreamMyCourse-Dsql-prod** deployed (deletion protection + Retain)." >> "$GITHUB_STEP_SUMMARY"

  dsql-compat-spike:
    name: DSQL compatibility spike
    runs-on: ubuntu-latest
    environment: prod
    needs: [gate, deploy-dsql-prod]
    permissions:
      id-token: write
      contents: read
    if: |
      always() && needs.gate.outputs.should_deploy == 'true' &&
      needs.deploy-dsql-prod.result == 'success' &&
      (github.event_name == 'workflow_run' || github.event_name == 'workflow_dispatch')
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.gate.outputs.checkout_sha }}

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install spike dependencies
        run: |
          pip install --quiet psycopg2-binary==2.9.9 aurora-dsql-python-connector

      - name: Run DSQL compatibility spike (live)
        run: |
          set -euo pipefail
          STACK="StreamMyCourse-Dsql-prod"
          REGION="${{ env.AWS_REGION }}"
          ENDPOINT="$(aws cloudformation describe-stacks \
            --stack-name "$STACK" \
            --region "$REGION" \
            --query "Stacks[0].Outputs[?OutputKey=='Endpoint'].OutputValue" \
            --output text)"
          if [[ -z "$ENDPOINT" || "$ENDPOINT" == "None" ]]; then
            echo "Missing DSQL Endpoint output on $STACK" >&2
            exit 1
          fi
          export DSQL_ENDPOINT="$ENDPOINT"
          export PYTHONPATH="${{ github.workspace }}/infrastructure/lambda/catalog:${PYTHONPATH:-}"
          python "${{ github.workspace }}/scripts/dsql_compat_spike.py" \
            --host "$ENDPOINT" \
            --iam-role-arn "${{ vars.AWS_DEPLOY_ROLE_ARN }}"

      - name: Summary
        if: success()
        run: |
          echo "## DSQL compatibility spike" >> "$GITHUB_STEP_SUMMARY"
          echo "Critical checks passed against **StreamMyCourse-Dsql-prod** (see job log for informational rows)." >> "$GITHUB_STEP_SUMMARY"

  apply-dsql-schema:
    name: Apply DSQL schema (prod)
    runs-on: ubuntu-latest
    environment: prod
    needs: [gate, dsql-compat-spike]
    permissions:
      id-token: write
      contents: read
    if: |
      always() && needs.gate.outputs.should_deploy == 'true' &&
      needs.dsql-compat-spike.result == 'success' &&
      (github.event_name == 'workflow_run' || github.event_name == 'workflow_dispatch')
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.gate.outputs.checkout_sha }}

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install schema applier dependencies
        run: |
          pip install --quiet psycopg2-binary==2.9.9 aurora-dsql-python-connector

      - name: Apply DSQL schema and grant prod Lambda roles
        run: |
          set -euo pipefail
          STACK="StreamMyCourse-Dsql-prod"
          REGION="${{ env.AWS_REGION }}"
          ACCOUNT="$(aws sts get-caller-identity --query Account --output text --region "$REGION")"
          ENDPOINT="$(aws cloudformation describe-stacks \
            --stack-name "$STACK" \
            --region "$REGION" \
            --query "Stacks[0].Outputs[?OutputKey=='Endpoint'].OutputValue" \
            --output text)"
          if [[ -z "$ENDPOINT" || "$ENDPOINT" == "None" ]]; then
            echo "Missing DSQL Endpoint output on $STACK" >&2
            exit 1
          fi
          export PYTHONPATH="${{ github.workspace }}/infrastructure/lambda/catalog:${PYTHONPATH:-}"
          python "${{ github.workspace }}/scripts/apply-dsql-schema.py" \
            --host "$ENDPOINT" \
            --iam-role-arn "arn:aws:iam::${ACCOUNT}:role/StreamMyCourse-CatalogLambdaRole-prod" \
            --iam-role-arn "arn:aws:iam::${ACCOUNT}:role/StreamMyCourse-Auth-prod-UserProfileSyncLambdaRole" \
            --iam-role-arn "arn:aws:iam::${ACCOUNT}:role/StreamMyCourse-BillingFulfillmentRole-prod"

      - name: Summary
        if: success()
        run: |
          echo "## DSQL schema (prod)" >> "$GITHUB_STEP_SUMMARY"
          echo "Applied \`0001_schema.sql\` via admin IAM; granted three prod Lambda roles." >> "$GITHUB_STEP_SUMMARY"

  deploy-backend-prod:
    name: Backend (prod) — Video + API
    runs-on: ubuntu-latest
    environment: prod
    needs:
      - gate
      - integration-http-tests
      - deploy-edge-prod
    permissions:
      id-token: write
      contents: read
    if: |
      always() &&
      needs.gate.outputs.should_deploy == 'true' &&
      needs.integration-http-tests.result == 'success' &&
      needs.deploy-edge-prod.result == 'success' &&
      (github.event_name == 'workflow_run' || github.event_name == 'workflow_dispatch')
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.gate.outputs.checkout_sha }}

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Require Cognito configuration
        env:
          COGNITO_DOMAIN_PREFIX: ${{ vars.COGNITO_DOMAIN_PREFIX }}
        run: |
          set -euo pipefail
          if [[ -z "${COGNITO_DOMAIN_PREFIX}" ]]; then
            echo "GitHub Environment variable COGNITO_DOMAIN_PREFIX must be set for full deploy (auth stack is required)." >&2
            exit 1
          fi

      - name: Require Google OAuth
        env:
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          if [[ -z "${GOOGLE_OAUTH_CLIENT_ID}" || -z "${GOOGLE_OAUTH_CLIENT_SECRET}" ]]; then
            echo "GitHub Environment secrets GOOGLE_OAUTH_CLIENT_ID and GOOGLE_OAUTH_CLIENT_SECRET must be set for full deploy (auth stack Google IdP)." >&2
            exit 1
          fi

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Package and upload Cognito user profile sync Lambda (prod)
        id: cognito_sync_pkg_prod
        env:
          CHECKOUT_SHA: ${{ needs.gate.outputs.checkout_sha }}
        run: |
          set -euo pipefail
          REGION="${{ env.AWS_REGION }}"
          ACCOUNT="$(aws sts get-caller-identity --query Account --output text --region "$REGION")"
          BUCKET="streammycourse-artifacts-${ACCOUNT}-${REGION}"
          SHA="${CHECKOUT_SHA:?missing gate checkout_sha}"
          SHORT="${SHA:0:12}"
          KEY="cognito-user-profile-sync-prod-${SHORT}.zip"
          STAGE="$(mktemp -d)"
          PKG="$STAGE/pkg"
          mkdir -p "$PKG"
          WS="${{ github.workspace }}"
          cp "$WS/infrastructure/lambda/cognito_user_profile_sync/_vendor_bootstrap.py" "$PKG/"
          cp "$WS/infrastructure/lambda/cognito_user_profile_sync/handler.py" "$PKG/"
          cp "$WS/infrastructure/lambda/cognito_user_profile_sync/session_sync.py" "$PKG/"
          cp "$WS/infrastructure/lambda/cognito_user_profile_sync/sync_config.py" "$PKG/"
          cp "$WS/infrastructure/lambda/cognito_user_profile_sync/repo.py" "$PKG/"
          cp "$WS/infrastructure/lambda/catalog/dsql_connect.py" "$PKG/"
          cp "$WS/infrastructure/lambda/catalog/services/common/db_tx.py" "$PKG/db_tx.py"
          pip install -r "$WS/infrastructure/lambda/cognito_user_profile_sync/requirements.txt" \
            --quiet \
            --platform manylinux2014_x86_64 \
            --only-binary=:all: \
            --python-version 3.11 \
            --implementation cp \
            -t "$PKG/_vendor"
          (cd "$PKG" && zip -rq "$STAGE/bundle.zip" .)
          aws s3 cp "$STAGE/bundle.zip" "s3://${BUCKET}/${KEY}" --region "$REGION"
          echo "bucket=${BUCKET}" >> "$GITHUB_OUTPUT"
          echo "key=${KEY}" >> "$GITHUB_OUTPUT"
          echo "Uploaded Cognito profile sync s3://${BUCKET}/${KEY}"

      - name: Package and upload Cognito PreSignUp Lambda (prod)
        id: cognito_pre_signup_pkg_prod
        env:
          CHECKOUT_SHA: ${{ needs.gate.outputs.checkout_sha }}
        run: |
          set -euo pipefail
          REGION="${{ env.AWS_REGION }}"
          ACCOUNT="$(aws sts get-caller-identity --query Account --output text --region "$REGION")"
          BUCKET="streammycourse-artifacts-${ACCOUNT}-${REGION}"
          SHA="${CHECKOUT_SHA:?missing gate checkout_sha}"
          SHORT="${SHA:0:12}"
          KEY="cognito-pre-signup-prod-${SHORT}.zip"
          STAGE="$(mktemp -d)"
          PKG="$STAGE/pkg"
          mkdir -p "$PKG"
          WS="${{ github.workspace }}"
          cp "$WS/infrastructure/lambda/cognito_pre_signup/handler.py" "$PKG/"
          cp "$WS/infrastructure/lambda/cognito_pre_signup/linking.py" "$PKG/"
          (cd "$PKG" && zip -rq "$STAGE/bundle.zip" .)
          aws s3 cp "$STAGE/bundle.zip" "s3://${BUCKET}/${KEY}" --region "$REGION"
          echo "bucket=${BUCKET}" >> "$GITHUB_OUTPUT"
          echo "key=${KEY}" >> "$GITHUB_OUTPUT"
          echo "Uploaded Cognito PreSignUp s3://${BUCKET}/${KEY}"

      - name: Package and upload Cognito custom email sender Lambda (prod)
        id: cognito_custom_email_pkg_prod
        env:
          CHECKOUT_SHA: ${{ needs.gate.outputs.checkout_sha }}
        run: |
          set -euo pipefail
          REGION="${{ env.AWS_REGION }}"
          ACCOUNT="$(aws sts get-caller-identity --query Account --output text --region "$REGION")"
          BUCKET="streammycourse-artifacts-${ACCOUNT}-${REGION}"
          SHA="${CHECKOUT_SHA:?missing gate checkout_sha}"
          SHORT="${SHA:0:12}"
          KEY="cognito-custom-email-sender-prod-${SHORT}.zip"
          STAGE="$(mktemp -d)"
          PKG="$STAGE/pkg"
          mkdir -p "$PKG"
          WS="${{ github.workspace }}/infrastructure/lambda/cognito_custom_email_sender"
          python -m pip install -r "$WS/requirements.txt" -t "$PKG" --upgrade --no-cache-dir
          cp "$WS"/*.py "$PKG/"
          (cd "$PKG" && zip -rq "$STAGE/bundle.zip" .)
          aws s3 cp "$STAGE/bundle.zip" "s3://${BUCKET}/${KEY}" --region "$REGION"
          echo "bucket=${BUCKET}" >> "$GITHUB_OUTPUT"
          echo "key=${KEY}" >> "$GITHUB_OUTPUT"
          echo "Uploaded Cognito custom email sender s3://${BUCKET}/${KEY}"

      - name: Resolve optional DSQL cluster ResourceArn (prod)
        id: dsql_cluster_arn_prod
        run: |
          set -euo pipefail
          STACK="StreamMyCourse-Dsql-prod"
          REGION="${{ env.AWS_REGION }}"
          if aws cloudformation describe-stacks --stack-name "$STACK" --region "$REGION" >/dev/null 2>&1; then
            ARN="$(aws cloudformation describe-stacks \
              --stack-name "$STACK" \
              --region "$REGION" \
              --query "Stacks[0].Outputs[?OutputKey=='ResourceArn'].OutputValue" \
              --output text)"
            if [[ -n "$ARN" && "$ARN" != "None" ]]; then
              echo "arn=${ARN}" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Resolve DSQL endpoint (prod)
        id: dsql_endpoint_prod
        run: |
          set -euo pipefail
          STACK="StreamMyCourse-Dsql-prod"
          REGION="${{ env.AWS_REGION }}"
          if aws cloudformation describe-stacks --stack-name "$STACK" --region "$REGION" >/dev/null 2>&1; then
            ENDPOINT="$(aws cloudformation describe-stacks \
              --stack-name "$STACK" \
              --region "$REGION" \
              --query "Stacks[0].Outputs[?OutputKey=='Endpoint'].OutputValue" \
              --output text)"
            if [[ -n "$ENDPOINT" && "$ENDPOINT" != "None" ]]; then
              echo "endpoint=${ENDPOINT}" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Ensure Zoho SMTP secret (prod)
        id: zoho_smtp_secret_prod
        env:
          ZOHO_SMTP_PASSWORD: ${{ secrets.ZOHO_SMTP_PASSWORD }}
        run: |
          set -euo pipefail
          chmod +x scripts/ensure-zoho-smtp-secret.sh
          eval "$(./scripts/ensure-zoho-smtp-secret.sh | tail -n 1)"
          echo "arn=${ZOHO_SMTP_SECRET_ARN}" >> "$GITHUB_OUTPUT"

      - name: Deploy auth (prod) — Cognito
        run: |
          set -euo pipefail
          STACK="StreamMyCourse-Auth-prod"
          DSQL_AUTH_OVERRIDES=()
          if [[ -n "${{ steps.dsql_endpoint_prod.outputs.endpoint }}" ]]; then
            DSQL_AUTH_OVERRIDES+=("DsqlEndpoint=${{ steps.dsql_endpoint_prod.outputs.endpoint }}")
          fi
          if [[ -n "${{ steps.dsql_cluster_arn_prod.outputs.arn }}" ]]; then
            DSQL_AUTH_OVERRIDES+=("DsqlClusterArn=${{ steps.dsql_cluster_arn_prod.outputs.arn }}")
          fi
          aws cloudformation validate-template \
            --template-body "file://${{ github.workspace }}/infrastructure/templates/auth-stack.yaml" \
            --region "${{ env.AWS_REGION }}"
          aws cloudformation deploy \
            --template-file "${{ github.workspace }}/infrastructure/templates/auth-stack.yaml" \
            --stack-name "$STACK" \
            --capabilities CAPABILITY_IAM CAPABILITY_NAMED_IAM \
            --region "${{ env.AWS_REGION }}" \
            --no-fail-on-empty-changeset \
            --parameter-overrides \
              "Environment=prod" \
              "CognitoDomainPrefix=${{ vars.COGNITO_DOMAIN_PREFIX }}" \
              ${STUDENT_COGNITO_CALLBACK_URLS:+StudentCallbackUrls=${STUDENT_COGNITO_CALLBACK_URLS}} \
              ${STUDENT_COGNITO_LOGOUT_URLS:+StudentLogoutUrls=${STUDENT_COGNITO_LOGOUT_URLS}} \
              ${TEACHER_COGNITO_CALLBACK_URLS:+TeacherCallbackUrls=${TEACHER_COGNITO_CALLBACK_URLS}} \
              ${TEACHER_COGNITO_LOGOUT_URLS:+TeacherLogoutUrls=${TEACHER_COGNITO_LOGOUT_URLS}} \
              "GoogleClientId=${GOOGLE_OAUTH_CLIENT_ID}" \
              "GoogleClientSecret=${GOOGLE_OAUTH_CLIENT_SECRET}" \
              "EnableUserProfileSync=true" \
              "CognitoUserProfileSyncCodeS3Bucket=${{ steps.cognito_sync_pkg_prod.outputs.bucket }}" \
              "CognitoUserProfileSyncCodeS3Key=${{ steps.cognito_sync_pkg_prod.outputs.key }}" \
              "CognitoPreSignUpCodeS3Bucket=${{ steps.cognito_pre_signup_pkg_prod.outputs.bucket }}" \
              "CognitoPreSignUpCodeS3Key=${{ steps.cognito_pre_signup_pkg_prod.outputs.key }}" \
              "CognitoCustomEmailSenderCodeS3Bucket=${{ steps.cognito_custom_email_pkg_prod.outputs.bucket }}" \
              "CognitoCustomEmailSenderCodeS3Key=${{ steps.cognito_custom_email_pkg_prod.outputs.key }}" \
              "ZohoSmtpSecretArn=${{ steps.zoho_smtp_secret_prod.outputs.arn }}" \
              "${DSQL_AUTH_OVERRIDES[@]}"

          student_client_id="$(aws cloudformation describe-stacks \
            --stack-name "$STACK" \
            --region "${{ env.AWS_REGION }}" \
            --query "Stacks[0].Outputs[?OutputKey=='StudentUserPoolClientId'].OutputValue" \
            --output text 2>/dev/null || true)"
          teacher_client_id="$(aws cloudformation describe-stacks \
            --stack-name "$STACK" \
            --region "${{ env.AWS_REGION }}" \
            --query "Stacks[0].Outputs[?OutputKey=='TeacherUserPoolClientId'].OutputValue" \
            --output text 2>/dev/null || true)"
          if [[ -n "$student_client_id" && "$student_client_id" != "None" && -n "$teacher_client_id" && "$teacher_client_id" != "None" ]]; then
            aws cloudformation deploy \
              --template-file "${{ github.workspace }}/infrastructure/templates/auth-stack.yaml" \
              --stack-name "$STACK" \
              --capabilities CAPABILITY_IAM CAPABILITY_NAMED_IAM \
              --region "${{ env.AWS_REGION }}" \
              --no-fail-on-empty-changeset \
              --parameter-overrides \
                "Environment=prod" \
                "CognitoDomainPrefix=${{ vars.COGNITO_DOMAIN_PREFIX }}" \
                ${STUDENT_COGNITO_CALLBACK_URLS:+StudentCallbackUrls=${STUDENT_COGNITO_CALLBACK_URLS}} \
                ${STUDENT_COGNITO_LOGOUT_URLS:+StudentLogoutUrls=${STUDENT_COGNITO_LOGOUT_URLS}} \
                ${TEACHER_COGNITO_CALLBACK_URLS:+TeacherCallbackUrls=${TEACHER_COGNITO_CALLBACK_URLS}} \
                ${TEACHER_COGNITO_LOGOUT_URLS:+TeacherLogoutUrls=${TEACHER_COGNITO_LOGOUT_URLS}} \
                "GoogleClientId=${GOOGLE_OAUTH_CLIENT_ID}" \
                "GoogleClientSecret=${GOOGLE_OAUTH_CLIENT_SECRET}" \
                "EnableUserProfileSync=true" \
                "CognitoUserProfileSyncCodeS3Bucket=${{ steps.cognito_sync_pkg_prod.outputs.bucket }}" \
                "CognitoUserProfileSyncCodeS3Key=${{ steps.cognito_sync_pkg_prod.outputs.key }}" \
                "CognitoPreSignUpCodeS3Bucket=${{ steps.cognito_pre_signup_pkg_prod.outputs.bucket }}" \
                "CognitoPreSignUpCodeS3Key=${{ steps.cognito_pre_signup_pkg_prod.outputs.key }}" \
                "CognitoCustomEmailSenderCodeS3Bucket=${{ steps.cognito_custom_email_pkg_prod.outputs.bucket }}" \
                "CognitoCustomEmailSenderCodeS3Key=${{ steps.cognito_custom_email_pkg_prod.outputs.key }}" \
                "ZohoSmtpSecretArn=${{ steps.zoho_smtp_secret_prod.outputs.arn }}" \
                "StudentCognitoClientId=${student_client_id}" \
                "TeacherCognitoClientId=${teacher_client_id}" \
                "${DSQL_AUTH_OVERRIDES[@]}"
          fi

          USER_POOL_ARN="$(aws cloudformation describe-stacks \
            --stack-name "$STACK" \
            --region "${{ env.AWS_REGION }}" \
            --query "Stacks[0].Outputs[?OutputKey=='UserPoolArn'].OutputValue" \
            --output text)"
          if [[ -z "$USER_POOL_ARN" ]]; then
            echo "Failed to resolve UserPoolArn output from $STACK" >&2
            exit 1
          fi
          echo "COGNITO_USER_POOL_ARN=$USER_POOL_ARN" >> "$GITHUB_ENV"
        env:
          STUDENT_COGNITO_CALLBACK_URLS: ${{ vars.STUDENT_COGNITO_CALLBACK_URLS }}
          STUDENT_COGNITO_LOGOUT_URLS: ${{ vars.STUDENT_COGNITO_LOGOUT_URLS }}
          TEACHER_COGNITO_CALLBACK_URLS: ${{ vars.TEACHER_COGNITO_CALLBACK_URLS }}
          TEACHER_COGNITO_LOGOUT_URLS: ${{ vars.TEACHER_COGNITO_LOGOUT_URLS }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}

      - name: Ensure HyperPay secret (prod)
        id: hyperpay_secret_prod
        env:
          HYPERPAY_ACCESS_TOKEN: ${{ secrets.HYPERPAY_ACCESS_TOKEN }}
          HYPERPAY_ENTITY_ID: ${{ secrets.HYPERPAY_ENTITY_ID }}
          HYPERPAY_WEBHOOK_SECRET: ${{ secrets.HYPERPAY_WEBHOOK_SECRET }}
        run: |
          set -euo pipefail
          chmod +x scripts/ensure-hyperpay-secret.sh
          eval "$(./scripts/ensure-hyperpay-secret.sh | tail -n 1)"
          echo "arn=${HYPERPAY_SECRET_ARN}" >> "$GITHUB_OUTPUT"

      - name: Deploy prod
        env:
          HYPERPAY_SECRET_ARN: ${{ secrets.HYPERPAY_SECRET_ARN }}
          HYPERPAY_WEBHOOK_SECRET: ${{ secrets.HYPERPAY_WEBHOOK_SECRET }}
          PAYMENT_PROVIDER: ${{ vars.PAYMENT_PROVIDER }}
          BILLING_FULFILLMENT_ALERT_EMAIL: ${{ vars.BILLING_FULFILLMENT_ALERT_EMAIL }}
          BILLING_TEACHER_SUB: ${{ vars.BILLING_TEACHER_SUB }}
          VIDEO_PROVIDER: s3
          ZOHO_SMTP_SECRET_ARN: ${{ steps.zoho_smtp_secret_prod.outputs.arn }}
        run: |
          set -euo pipefail
          if [[ -z "${HYPERPAY_SECRET_ARN:-}" ]]; then
            HYPERPAY_SECRET_ARN="$(aws secretsmanager describe-secret \
              --secret-id streammycourse/hyperpay/prod \
              --region "${AWS_REGION:-eu-west-1}" \
              --query ARN \
              --output text 2>/dev/null || true)"
            if [[ -n "${HYPERPAY_SECRET_ARN}" && "${HYPERPAY_SECRET_ARN}" != "None" ]]; then
              export HYPERPAY_SECRET_ARN
            fi
          fi
          if [[ -z "${HYPERPAY_SECRET_ARN:-}" && -n "${{ steps.hyperpay_secret_prod.outputs.arn }}" ]]; then
            export HYPERPAY_SECRET_ARN="${{ steps.hyperpay_secret_prod.outputs.arn }}"
          fi
          chmod +x scripts/deploy-backend.sh
          ./scripts/deploy-backend.sh prod

      - name: Update payments stack — DsqlClusterArn (optional)
        if: steps.dsql_cluster_arn_prod.outputs.arn != ''
        run: |
          set -euo pipefail
          STACK="StreamMyCourse-Payments-prod"
          REGION="${{ env.AWS_REGION }}"
          if ! aws cloudformation describe-stacks --stack-name "$STACK" --region "$REGION" >/dev/null 2>&1; then
            echo "Payments stack missing; skipping DsqlClusterArn patch"
            exit 0
          fi
          aws cloudformation validate-template \
            --template-body "file://${{ github.workspace }}/infrastructure/templates/payments-stack.yaml" \
            --region "$REGION"
          aws cloudformation deploy \
            --template-file "${{ github.workspace }}/infrastructure/templates/payments-stack.yaml" \
            --stack-name "$STACK" \
            --capabilities CAPABILITY_IAM CAPABILITY_NAMED_IAM \
            --region "$REGION" \
            --no-fail-on-empty-changeset \
            --parameter-overrides \
              "DsqlClusterArn=${{ steps.dsql_cluster_arn_prod.outputs.arn }}" \
              "DsqlEndpoint=${{ steps.dsql_endpoint_prod.outputs.endpoint }}"

      - name: Summary
        if: success()
        run: |
          echo "## Backend prod" >> "$GITHUB_STEP_SUMMARY"
          echo "Video stack + API stack for **prod** deployed (or no-op changeset)." >> "$GITHUB_STEP_SUMMARY"

  integration-http-tests:
    name: Integration HTTP tests — pytest against deployed dev API
    runs-on: ubuntu-latest
    # Cognito test passwords live on the prod environment. Stack names below are dev.
    environment: prod
    needs: [gate, deploy-dev-stage, resolve-oidc-deploy-role]
    permissions:
      id-token: write
      contents: read
    if: |
      always() &&
      needs.gate.outputs.should_deploy == 'true' &&
      needs.resolve-oidc-deploy-role.result == 'success' &&
      needs.deploy-dev-stage.result == 'success' &&
      (github.event_name == 'workflow_run' || github.event_name == 'workflow_dispatch')
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.gate.outputs.checkout_sha }}

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ needs.resolve-oidc-deploy-role.outputs.aws_deploy_role_arn }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: pip install -r tests/integration/requirements.txt

      - name: Resolve prod stack outputs
        env:
          API_STACK: StreamMyCourse-Api-dev
          VIDEO_STACK: StreamMyCourse-DevVideo-dev
          DSQL_STACK: StreamMyCourse-Dsql-dev
        run: |
          set -euo pipefail
          REGION="${{ env.AWS_REGION }}"
          API_BASE_URL="$(aws cloudformation describe-stacks \
            --stack-name "$API_STACK" \
            --region "$REGION" \
            --query "Stacks[0].Outputs[?OutputKey=='ApiEndpoint'].OutputValue" \
            --output text)"
          VIDEO_BUCKET="$(aws cloudformation describe-stacks \
            --stack-name "$VIDEO_STACK" \
            --region "$REGION" \
            --query "Stacks[0].Outputs[?OutputKey=='BucketName'].OutputValue" \
            --output text)"
          DSQL_ENDPOINT="$(aws cloudformation describe-stacks \
            --stack-name "$DSQL_STACK" \
            --region "$REGION" \
            --query "Stacks[0].Outputs[?OutputKey=='Endpoint'].OutputValue" \
            --output text)"
          CORS_CSV="$(aws cloudformation describe-stacks \
            --stack-name "$API_STACK" \
            --region "$REGION" \
            --query "Stacks[0].Parameters[?ParameterKey=='CorsAllowOrigin'].ParameterValue" \
            --output text)"
          FIRST_CORS_ORIGIN="${CORS_CSV%%,*}"
          FIRST_CORS_ORIGIN="${FIRST_CORS_ORIGIN#"${FIRST_CORS_ORIGIN%%[![:space:]]*}"}"
          FIRST_CORS_ORIGIN="${FIRST_CORS_ORIGIN%"${FIRST_CORS_ORIGIN##*[![:space:]]}"}"
          if [[ -z "$FIRST_CORS_ORIGIN" || "$FIRST_CORS_ORIGIN" == "None" ]]; then
            FIRST_CORS_ORIGIN="http://localhost:5173"
          fi
          if [[ -z "$API_BASE_URL" || -z "$VIDEO_BUCKET" || -z "$DSQL_ENDPOINT" || "$DSQL_ENDPOINT" == "None" ]]; then
            echo "Failed to resolve dev stack outputs (ApiEndpoint / BucketName / DSQL Endpoint)" >&2
            exit 1
          fi
          case "$DSQL_ENDPOINT" in
            cfuhjrrzy65ngud25rdqqso5t4*)
              echo "Refusing to run integration tests against the prod DSQL cluster" >&2
              exit 1
              ;;
          esac
          {
            echo "INTEGRATION_API_BASE_URL=$API_BASE_URL"
            echo "INTEGRATION_API_STACK=$API_STACK"
            echo "INTEGRATION_VIDEO_BUCKET=$VIDEO_BUCKET"
            echo "INTEGRATION_AWS_REGION=$REGION"
            echo "INTEGRATION_EXPECTED_CORS_ORIGIN=$FIRST_CORS_ORIGIN"
            echo "INTEGRATION_BILLING_ENV=dev"
            echo "INTEGRATION_AUTH_STACK=StreamMyCourse-Auth-dev"
            echo "INTEGRATION_VIDEO_PROVIDER=s3"
            echo "DSQL_ENDPOINT=$DSQL_ENDPOINT"
          } >> "$GITHUB_ENV"
          echo "Resolved dev API: $API_BASE_URL"
          echo "Resolved dev bucket: $VIDEO_BUCKET"

      - name: Require Cognito credentials for integration HTTP tests
        env:
          COGNITO_TEST_PASSWORD: ${{ secrets.COGNITO_VERIFY_TEST_PASSWORD }}
          COGNITO_TEST_USERNAME: ${{ vars.COGNITO_VERIFY_TEST_USERNAME }}
          LEGACY_JWT: ${{ secrets.COGNITO_VERIFY_JWT }}
        run: |
          set -euo pipefail
          if [[ -z "${COGNITO_TEST_PASSWORD:-}" ]] && [[ -z "${LEGACY_JWT:-}" ]]; then
            echo "::error::On GitHub Environment \"prod\" set secret COGNITO_VERIFY_TEST_PASSWORD and optional variable COGNITO_VERIFY_TEST_USERNAME (default ci-rds-verify@noreply.local), or secret COGNITO_VERIFY_JWT as fallback. See tests/integration/README.md."
            exit 1
          fi

      - name: Ensure CI Cognito playback profile attributes (prod)
        env:
          COGNITO_TEST_PASSWORD: ${{ secrets.COGNITO_VERIFY_TEST_PASSWORD }}
          COGNITO_TEST_USERNAME: ${{ vars.COGNITO_VERIFY_TEST_USERNAME }}
          COGNITO_TEST_PASSWORD_ALT: ${{ secrets.COGNITO_VERIFY_TEST_PASSWORD_ALT }}
          COGNITO_TEST_USERNAME_ALT: ${{ vars.COGNITO_VERIFY_TEST_USERNAME_ALT }}
          COGNITO_TEST_PASSWORD_STUDENT: ${{ secrets.COGNITO_VERIFY_TEST_PASSWORD_STUDENT }}
          COGNITO_TEST_USERNAME_STUDENT: ${{ vars.COGNITO_VERIFY_TEST_USERNAME_STUDENT }}
        run: |
          set -euo pipefail
          if [[ -z "${COGNITO_TEST_PASSWORD:-}" ]]; then
            echo "Skipping Cognito playback profile ensure (COGNITO_VERIFY_TEST_PASSWORD unset)"
            exit 0
          fi
          export CI_RDS_VERIFY_AUTH_STACK=StreamMyCourse-Auth-dev
          bash ./scripts/ensure-integration-cognito-playback-profiles.sh

      - name: Mint Cognito JWT (or static JWT fallback)
        env:
          COGNITO_TEST_PASSWORD: ${{ secrets.COGNITO_VERIFY_TEST_PASSWORD }}
          COGNITO_TEST_USERNAME: ${{ vars.COGNITO_VERIFY_TEST_USERNAME }}
          LEGACY_JWT: ${{ secrets.COGNITO_VERIFY_JWT }}
          AUTH_STACK: StreamMyCourse-Auth-dev
        run: |
          set -euo pipefail
          REGION="${{ env.AWS_REGION }}"
          USERNAME="${COGNITO_TEST_USERNAME:-ci-rds-verify@noreply.local}"
          TOKEN=""

          if [[ -n "${COGNITO_TEST_PASSWORD:-}" ]]; then
            pool="$(aws cloudformation describe-stacks \
              --stack-name "$AUTH_STACK" \
              --region "$REGION" \
              --query "Stacks[0].Outputs[?OutputKey=='UserPoolId'].OutputValue" \
              --output text)"
            client="$(aws cloudformation describe-stacks \
              --stack-name "$AUTH_STACK" \
              --region "$REGION" \
              --query "Stacks[0].Outputs[?OutputKey=='TeacherUserPoolClientId'].OutputValue" \
              --output text)"
            if [[ -n "$pool" && "$pool" != "None" && -n "$client" && "$client" != "None" ]]; then
              tmp_json="$(mktemp)"
              jq -n \
                --arg pool "$pool" \
                --arg client "$client" \
                --arg user "$USERNAME" \
                --arg pass "$COGNITO_TEST_PASSWORD" \
                '{UserPoolId:$pool,ClientId:$client,AuthFlow:"ADMIN_USER_PASSWORD_AUTH",AuthParameters:{USERNAME:$user,PASSWORD:$pass}}' \
                >"$tmp_json"
              if TOKEN="$(aws cognito-idp admin-initiate-auth \
                --cli-input-json "file://$tmp_json" \
                --region "$REGION" \
                --query 'AuthenticationResult.IdToken' \
                --output text 2>/dev/null)"; then
                :
              else
                TOKEN=""
              fi
              rm -f "$tmp_json"
            fi
          fi

          if [[ -n "${TOKEN:-}" && "$TOKEN" != "None" ]]; then
            echo "::add-mask::$TOKEN"
            echo "INTEGRATION_COGNITO_JWT=$TOKEN" >> "$GITHUB_ENV"
            echo "Minted Cognito IdToken for integration HTTP tests (dev; user: $USERNAME)"
          elif [[ -n "${LEGACY_JWT:-}" ]]; then
            if [[ -n "${COGNITO_TEST_PASSWORD:-}" ]]; then
              echo "::warning::Cognito token minting failed - using static JWT fallback"
            else
              echo "Using static JWT fallback (COGNITO_VERIFY_TEST_PASSWORD unset on this environment)"
            fi
            echo "::add-mask::$LEGACY_JWT"
            echo "INTEGRATION_COGNITO_JWT=$LEGACY_JWT" >> "$GITHUB_ENV"
          else
            echo "::error::Could not mint Cognito IdToken and COGNITO_VERIFY_JWT is not set on this environment"
            exit 1
          fi

      - name: Mint Cognito JWT ALT (teacher B) - conditional
        env:
          COGNITO_TEST_PASSWORD_ALT: ${{ secrets.COGNITO_VERIFY_TEST_PASSWORD_ALT }}
          COGNITO_TEST_USERNAME_ALT: ${{ vars.COGNITO_VERIFY_TEST_USERNAME_ALT }}
          AUTH_STACK: StreamMyCourse-Auth-dev
        run: |
          set -euo pipefail
          REGION="${{ env.AWS_REGION }}"
          USERNAME="${COGNITO_TEST_USERNAME_ALT:-ci-rds-verify-2@noreply.local}"
          TOKEN=""

          if [[ -z "${COGNITO_TEST_PASSWORD_ALT:-}" ]]; then
            echo "Skipping ALT JWT minting (COGNITO_VERIFY_TEST_PASSWORD_ALT not set)"
            exit 0
          fi

          if [[ -n "${COGNITO_TEST_PASSWORD_ALT:-}" ]]; then
            pool="$(aws cloudformation describe-stacks \
              --stack-name "$AUTH_STACK" \
              --region "$REGION" \
              --query "Stacks[0].Outputs[?OutputKey=='UserPoolId'].OutputValue" \
              --output text)"
            client="$(aws cloudformation describe-stacks \
              --stack-name "$AUTH_STACK" \
              --region "$REGION" \
              --query "Stacks[0].Outputs[?OutputKey=='TeacherUserPoolClientId'].OutputValue" \
              --output text)"
            if [[ -n "$pool" && "$pool" != "None" && -n "$client" && "$client" != "None" ]]; then
              tmp_json="$(mktemp)"
              jq -n \
                --arg pool "$pool" \
                --arg client "$client" \
                --arg user "$USERNAME" \
                --arg pass "$COGNITO_TEST_PASSWORD_ALT" \
                '{UserPoolId:$pool,ClientId:$client,AuthFlow:"ADMIN_USER_PASSWORD_AUTH",AuthParameters:{USERNAME:$user,PASSWORD:$pass}}' \
                >"$tmp_json"
              if TOKEN="$(aws cognito-idp admin-initiate-auth \
                --cli-input-json "file://$tmp_json" \
                --region "$REGION" \
                --query 'AuthenticationResult.IdToken' \
                --output text 2>/dev/null)"; then
                :
              else
                TOKEN=""
              fi
              rm -f "$tmp_json"
            fi
          fi

          if [[ -n "${TOKEN:-}" && "$TOKEN" != "None" ]]; then
            echo "::add-mask::$TOKEN"
            echo "INTEGRATION_COGNITO_JWT_ALT=$TOKEN" >> "$GITHUB_ENV"
            echo "Minted Cognito IdToken ALT for integration HTTP tests (dev; user: $USERNAME)"
          else
            echo "::warning::Could not mint Cognito IdToken ALT (teacher B)"
          fi

      - name: Mint Cognito JWT STUDENT - conditional
        env:
          COGNITO_TEST_PASSWORD_STUDENT: ${{ secrets.COGNITO_VERIFY_TEST_PASSWORD_STUDENT }}
          COGNITO_TEST_USERNAME_STUDENT: ${{ vars.COGNITO_VERIFY_TEST_USERNAME_STUDENT }}
          AUTH_STACK: StreamMyCourse-Auth-dev
        run: |
          set -euo pipefail
          REGION="${{ env.AWS_REGION }}"
          USERNAME="${COGNITO_TEST_USERNAME_STUDENT:-ci-student@noreply.local}"
          TOKEN=""

          if [[ -z "${COGNITO_TEST_PASSWORD_STUDENT:-}" ]]; then
            echo "Skipping STUDENT JWT minting (COGNITO_VERIFY_TEST_PASSWORD_STUDENT not set)"
            exit 0
          fi

          if [[ -n "${COGNITO_TEST_PASSWORD_STUDENT:-}" ]]; then
            pool="$(aws cloudformation describe-stacks \
              --stack-name "$AUTH_STACK" \
              --region "$REGION" \
              --query "Stacks[0].Outputs[?OutputKey=='UserPoolId'].OutputValue" \
              --output text)"
            client="$(aws cloudformation describe-stacks \
              --stack-name "$AUTH_STACK" \
              --region "$REGION" \
              --query "Stacks[0].Outputs[?OutputKey=='StudentUserPoolClientId'].OutputValue" \
              --output text)"
            if [[ -n "$pool" && "$pool" != "None" && -n "$client" && "$client" != "None" ]]; then
              tmp_json="$(mktemp)"
              jq -n \
                --arg pool "$pool" \
                --arg client "$client" \
                --arg user "$USERNAME" \
                --arg pass "$COGNITO_TEST_PASSWORD_STUDENT" \
                '{UserPoolId:$pool,ClientId:$client,AuthFlow:"ADMIN_USER_PASSWORD_AUTH",AuthParameters:{USERNAME:$user,PASSWORD:$pass}}' \
                >"$tmp_json"
              if TOKEN="$(aws cognito-idp admin-initiate-auth \
                --cli-input-json "file://$tmp_json" \
                --region "$REGION" \
                --query 'AuthenticationResult.IdToken' \
                --output text 2>/dev/null)"; then
                :
              else
                TOKEN=""
              fi
              rm -f "$tmp_json"
            fi
          fi

          if [[ -n "${TOKEN:-}" && "$TOKEN" != "None" ]]; then
            echo "::add-mask::$TOKEN"
            echo "INTEGRATION_COGNITO_JWT_STUDENT=$TOKEN" >> "$GITHUB_ENV"
            echo "Minted Cognito IdToken STUDENT for integration HTTP tests (dev; user: $USERNAME)"
          else
            echo "::warning::Could not mint Cognito IdToken STUDENT"
          fi

      - name: Run pytest
        id: pytest
        working-directory: tests/integration
        env:
          COGNITO_TEST_PASSWORD_STUDENT: ${{ secrets.COGNITO_VERIFY_TEST_PASSWORD_STUDENT }}
          COGNITO_TEST_USERNAME_STUDENT: ${{ vars.COGNITO_VERIFY_TEST_USERNAME_STUDENT }}
        run: |
          echo "[integration-diag] pytest_start=$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          set +e
          pytest -q --junitxml=results.xml
          rc=$?
          set -e
          echo "[integration-diag] pytest_end=$(date -u +"%Y-%m-%dT%H:%M:%SZ") exit=$rc"
          exit $rc

      - name: DSQL orphan audit (dev)
        if: steps.pytest.outcome == 'success'
        run: |
          set -euo pipefail
          python scripts/dsql_orphan_audit.py --host "$DSQL_ENDPOINT"

      - name: Summary
        if: always()
        run: |
          if [[ "${{ steps.pytest.outcome }}" == "success" ]]; then
            echo "## Integration HTTP tests: PASSED" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## Integration HTTP tests: FAILED" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload pytest results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: integration-http-test-results
          path: tests/integration/results.xml
          if-no-files-found: warn

  deploy-web-prod:
    name: Web (prod)
    needs:
      - gate
      - integration-http-tests
      - deploy-backend-prod
      - deploy-edge-prod
    if: |
      always() &&
      needs.gate.outputs.should_deploy == 'true' &&
      needs.integration-http-tests.result == 'success' &&
      needs.deploy-backend-prod.result == 'success' &&
      needs.deploy-edge-prod.result == 'success' &&
      (github.event_name == 'workflow_run' || github.event_name == 'workflow_dispatch')
    uses: ./.github/workflows/deploy-web-reusable.yml
    secrets:
      AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
      VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
      VITE_COGNITO_USER_POOL_ID: ${{ secrets.VITE_COGNITO_USER_POOL_ID }}
      VITE_COGNITO_STUDENT_CLIENT_ID: ${{ secrets.VITE_COGNITO_STUDENT_CLIENT_ID }}
      VITE_COGNITO_DOMAIN: ${{ secrets.VITE_COGNITO_DOMAIN }}
    with:
      target_environment: prod
      checkout_ref: ${{ needs.gate.outputs.checkout_sha }}

  deploy-teacher-web-prod:
    name: Teacher Web (prod)
    needs:
      - gate
      - integration-http-tests
      - deploy-backend-prod
      - deploy-edge-prod
    if: |
      always() &&
      needs.gate.outputs.should_deploy == 'true' &&
      needs.integration-http-tests.result == 'success' &&
      needs.deploy-backend-prod.result == 'success' &&
      needs.deploy-edge-prod.result == 'success' &&
      (github.event_name == 'workflow_run' || github.event_name == 'workflow_dispatch')
    uses: ./.github/workflows/deploy-teacher-web-reusable.yml
    secrets:
      AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
      VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
      VITE_COGNITO_USER_POOL_ID: ${{ secrets.VITE_COGNITO_USER_POOL_ID }}
      VITE_COGNITO_TEACHER_CLIENT_ID: ${{ secrets.VITE_COGNITO_TEACHER_CLIENT_ID }}
      VITE_COGNITO_DOMAIN: ${{ secrets.VITE_COGNITO_DOMAIN }}
    with:
      target_environment: prod
      checkout_ref: ${{ needs.gate.outputs.checkout_sha }}
